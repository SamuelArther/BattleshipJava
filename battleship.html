<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Battleship: place your fleet, read the water, and sink theirs first.">
<meta name="theme-color" content="#040c16">
<style>
  html { color-scheme: light dark; }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Battleship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/*
 * BattleshipJava, on the web.
 *
 * theme.css translated as directly as CSS allows: the same tokens, the same class names,
 * the same nine palettes layered over one palette's worth of actual styling.
 * JavaFX derive(c, n%) becomes color-mix toward white or black by the same percentage.
 */

:root {
  --font-ui: "Segoe UI", "Helvetica Neue", "DejaVu Sans", sans-serif;
  --font-serif: Georgia, Gelasio, "Times New Roman", serif;

  --ink-deep:     #040c16;
  --ink:          #0a1a2b;
  --ink-raised:   #12293f;

  --parchment:    #eaf4ff;
  --muted:        #9db4ca;

  --brass:        #e0b25a;
  --brass-bright: #f6d494;
  --brass-deep:   #a97c2c;

  --danger:       #e5484d;
  --danger-deep:  #7f1d1f;

  --tile-water:   #a9c9e1;
  --tile-ship:    #79aee6;
  --tile-hit:     #e8555c;
  --tile-miss:    #7c8a99;

  --sea-highlight: #17364f;
  --button-top:    #f3f8ff;
  --button-bottom: #c7dcf1;
  --button-ink:    var(--ink);
  --ready-top:     #7fd6aa;
  --ready-bottom:  #3f9a72;
  --ready-edge:    #a9edcb;
  --panel-tint:    rgba(255, 255, 255, 0.07);
  --panel-edge:    rgba(160, 205, 245, 0.20);

  --tile: 28px;
  --grid-gap: 2px;
  --axis: 18px;
}

/* Palettes. Each redefines colour tokens; the OS ones also redefine geometry. */

body[data-skin="crimson"] {
  --ink-deep:#140406; --ink:#240a0d; --ink-raised:#381216;
  --parchment:#ffeef0; --muted:#cf9ba0;
  --brass:#e5a24a; --brass-bright:#ffd08a; --brass-deep:#9c6318;
  --danger:#ff4d55; --danger-deep:#7a0f16;
  --tile-water:#d8b3b6; --tile-ship:#e0793f; --tile-hit:#ff3b45; --tile-miss:#8b7477;
  --sea-highlight:#4a1016; --button-top:#ffeef0; --button-bottom:#e0bcc0;
  --ready-top:#e8a24a; --ready-bottom:#a86a1c; --ready-edge:#ffd08a;
  --panel-tint:rgba(255,220,220,0.07); --panel-edge:rgba(255,170,175,0.22);
}
body[data-skin="abyss"] {
  --ink-deep:#000407; --ink:#01121a; --ink-raised:#04222f;
  --parchment:#dff6ff; --muted:#7fa9ba;
  --brass:#34d3e0; --brass-bright:#8ef2fb; --brass-deep:#147d88;
  --danger:#ff5470; --danger-deep:#6d0f22;
  --tile-water:#8fb6c6; --tile-ship:#4fd0e6; --tile-hit:#ff5470; --tile-miss:#5f7580;
  --sea-highlight:#06364a; --button-top:#dff6ff; --button-bottom:#a5cfdd;
  --ready-top:#4fe0b0; --ready-bottom:#1c8a68; --ready-edge:#9df5d6;
  --panel-tint:rgba(140,230,255,0.07); --panel-edge:rgba(90,200,225,0.24);
}
body[data-skin="daylight"] {
  --ink-deep:#e9eff5; --ink:#dbe5ee; --ink-raised:#ffffff;
  --parchment:#12212f; --muted:#536676;
  --brass:#a0721a; --brass-bright:#c9993a; --brass-deep:#6d4a08;
  --danger:#c4323a; --danger-deep:#7c1116;
  --tile-water:#b7d3e6; --tile-ship:#4a89c8; --tile-hit:#d34049; --tile-miss:#92a1ad;
  --sea-highlight:#ffffff; --button-top:#2c4d6b; --button-bottom:#17334c; --button-ink:#f2f8ff;
  --ready-top:#3f9a72; --ready-bottom:#246b4d; --ready-edge:#7fd6aa;
  --panel-tint:rgba(20,45,70,0.06); --panel-edge:rgba(20,45,70,0.18);
}
body[data-skin="signal"] {
  --ink-deep:#000000; --ink:#0d0d0d; --ink-raised:#1c1c1c;
  --parchment:#ffffff; --muted:#c9c9c9;
  --brass:#ffb000; --brass-bright:#ffd45e; --brass-deep:#9c6a00;
  --danger:#ff6f00; --danger-deep:#8a3c00;
  --tile-water:#d6d6d6; --tile-ship:#0072e5; --tile-hit:#ff6f00; --tile-miss:#4a4a4a;
  --sea-highlight:#16233a; --button-top:#ffffff; --button-bottom:#cfcfcf;
  --ready-top:#00a3a3; --ready-bottom:#006e6e; --ready-edge:#6ff0f0;
  --panel-tint:rgba(255,255,255,0.10); --panel-edge:rgba(255,255,255,0.42);
}
body[data-skin="win98"] {
  --font-ui:"MS Sans Serif", Tahoma, "Segoe UI", sans-serif;
  --font-serif:"MS Sans Serif", Tahoma, sans-serif;
  --ink-deep:#008080; --ink:#c0c0c0; --ink-raised:#c0c0c0;
  --parchment:#000000; --muted:#404040;
  --brass:#000080; --brass-bright:#1084d0; --brass-deep:#000060;
  --danger:#c00000; --danger-deep:#800000;
  --tile-water:#ffffff; --tile-ship:#000080; --tile-hit:#c00000; --tile-miss:#808080;
  --sea-highlight:#008080; --button-top:#c0c0c0; --button-bottom:#c0c0c0; --button-ink:#000000;
  --ready-top:#c0c0c0; --ready-bottom:#c0c0c0; --ready-edge:#ffffff;
  --panel-tint:#c0c0c0; --panel-edge:#ffffff;
  --bevel-light:#ffffff; --bevel-face:#c0c0c0; --bevel-shadow:#808080; --bevel-dark:#000000;
}
body[data-skin="winxp"] {
  --font-ui:Tahoma, "Segoe UI", sans-serif;
  --font-serif:"Trebuchet MS", Tahoma, sans-serif;
  --ink-deep:#3a6ea5; --ink:#ece9d8; --ink-raised:#ffffff;
  --parchment:#000000; --muted:#4a4a4a;
  --brass:#0a49a8; --brass-bright:#3d8bea; --brass-deep:#003399;
  --danger:#d64541; --danger-deep:#9b1c1a;
  --tile-water:#ffffff; --tile-ship:#316ac5; --tile-hit:#d64541; --tile-miss:#a0a0a0;
  --sea-highlight:#6ea3d8; --button-top:#ffffff; --button-bottom:#ece9d8; --button-ink:#000000;
  --ready-top:#b7e08a; --ready-bottom:#5c9c34; --ready-edge:#ffffff;
  --panel-tint:#ece9d8; --panel-edge:#7ba2cc;
}
body[data-skin="win7"] {
  --font-ui:"Segoe UI", Tahoma, sans-serif;
  --font-serif:"Segoe UI Light", "Segoe UI", sans-serif;
  --ink-deep:#0d2b4a; --ink:#16406b; --ink-raised:#eef5fc;
  --parchment:#10202f; --muted:#4d6377;
  --brass:#1f6fc4; --brass-bright:#5aa9f0; --brass-deep:#12518f;
  --danger:#d24b47; --danger-deep:#8f2320;
  --tile-water:#eaf3fb; --tile-ship:#3d8be0; --tile-hit:#d24b47; --tile-miss:#9aa8b4;
  --sea-highlight:#2f6ea8; --button-top:#ffffff; --button-bottom:#dbeaf7; --button-ink:#10202f;
  --ready-top:#b6e8a0; --ready-bottom:#5aa83c; --ready-edge:#d7f5c8;
  --panel-tint:rgba(255,255,255,0.80); --panel-edge:rgba(255,255,255,0.95);
}
body[data-skin="macos"] {
  --font-ui:"Helvetica Neue", "Segoe UI", "SF Pro Text", sans-serif;
  --font-serif:"Helvetica Neue", "Segoe UI Semibold", sans-serif;
  --ink-deep:#e8e8ed; --ink:#f2f2f7; --ink-raised:#ffffff;
  --parchment:#1c1c1e; --muted:#6e6e73;
  --brass:#007aff; --brass-bright:#4da2ff; --brass-deep:#0051a8;
  --danger:#ff3b30; --danger-deep:#b3271e;
  --tile-water:#e5e5ea; --tile-ship:#007aff; --tile-hit:#ff3b30; --tile-miss:#aeaeb2;
  --sea-highlight:#ffffff; --button-top:#ffffff; --button-bottom:#f5f5f7; --button-ink:#1c1c1e;
  --ready-top:#34c759; --ready-bottom:#248a3d; --ready-edge:#6fe08c;
  --panel-tint:rgba(255,255,255,0.9); --panel-edge:rgba(0,0,0,0.10);
}

/* Screen */

*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: var(--font-ui);
  background: var(--ink-deep);
  color: var(--parchment);
  -webkit-text-size-adjust: 100%;
}

.root-pane {
  min-height: 100vh;
  min-height: 100dvh;
  /* viewport-fit=cover lets the page draw under the notch and the home indicator,
     so every edge has to be padded back out to the safe area. */
  padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
           max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse 120% 120% at 50% 0%, var(--sea-highlight) 0%, var(--ink-deep) 70%),
    linear-gradient(to bottom, var(--ink) 0%, var(--ink-deep) 100%);
}
body[data-skin="win98"] .root-pane { background: #008080; }
body[data-skin="winxp"] .root-pane { background: linear-gradient(to bottom, #4a83bd 0%, #2f5c8a 100%); }
body[data-skin="win7"] .root-pane {
  background:
    radial-gradient(ellipse 130% 130% at 50% 0%, #3f7fbe 0%, #0d2b4a 72%),
    linear-gradient(to bottom, #16406b, #071a2e);
}
body[data-skin="macos"] .root-pane {
  background:
    radial-gradient(ellipse 130% 130% at 50% 0%, #ffffff 0%, #e3e3e9 70%),
    linear-gradient(to bottom, #f2f2f7, #dcdce2);
}

/* Type */

.screen-title {
  font-family: var(--font-serif);
  font-size: 46px;
  font-weight: bold;
  line-height: 1.15;
  background: linear-gradient(to bottom, var(--brass-bright) 0%, var(--brass) 55%, var(--brass-deep) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 3px 9px rgba(0, 0, 0, 0.75));
  text-wrap: balance;
}
.section-title { font-family: var(--font-serif); font-size: 21px; font-weight: bold; color: var(--parchment); }
.body-text { color: var(--parchment); font-size: 14px; }
.brand-tagline { color: var(--muted); font-size: 13px; }
.muted-text { color: var(--muted); font-size: 13px; }
.status-text { color: var(--parchment); font-size: 15px; }
.axis-label {
  font-family: var(--font-serif); font-size: 12px; font-weight: bold;
  color: color-mix(in srgb, #000 8%, var(--brass));
  display: flex; align-items: center; justify-content: center;
}

body[data-skin="win98"] .screen-title,
body[data-skin="winxp"] .screen-title,
body[data-skin="win7"] .screen-title,
body[data-skin="macos"] .screen-title {
  background: none; -webkit-text-fill-color: currentColor; color: #ffffff;
}
body[data-skin="win98"] .screen-title { font-size: 34px; filter: none; }
body[data-skin="winxp"] .screen-title { font-size: 38px; filter: drop-shadow(1px 2px 4px rgba(0,40,90,0.85)); }
body[data-skin="win7"] .screen-title { font-size: 44px; font-weight: normal; filter: drop-shadow(0 0 12px rgba(120,200,255,0.75)); }
body[data-skin="macos"] .screen-title { font-size: 42px; color: #1c1c1e; filter: none; }

body[data-skin="win98"] .section-title { font-size: 15px; color: #000; }
body[data-skin="winxp"] .section-title { font-size: 15px; color: #0a49a8; }
body[data-skin="win7"] .section-title { font-size: 17px; color: #12518f; font-weight: normal; }
body[data-skin="macos"] .section-title { font-size: 16px; color: #1c1c1e; }
body[data-skin="win98"] .body-text { font-size: 12px; }
body[data-skin="winxp"] .body-text { font-size: 12px; }
body[data-skin="win98"] .muted-text, body[data-skin="winxp"] .muted-text { font-size: 11px; }
body[data-skin="win98"] .brand-tagline { color: #fff; font-size: 12px; }
body[data-skin="winxp"] .brand-tagline { color: #dce9f7; font-size: 12px; }
body[data-skin="win7"] .brand-tagline { color: #cfe4f7; }
body[data-skin="macos"] .brand-tagline { color: #6e6e73; }

/* Panels */

.panel {
  background: linear-gradient(to bottom, var(--panel-tint) 0%, rgba(255, 255, 255, 0.025) 100%);
  border-radius: 16px;
  border: 1px solid var(--panel-edge);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.55);
}
.board-frame {
  position: relative;
  padding: 10px;
  border-radius: 14px;
  border: 2px solid rgba(224, 178, 90, 0.7);
  background:
    radial-gradient(ellipse at 32% 18%, rgba(224, 178, 90, 0.07), transparent 62%),
    linear-gradient(to bottom, rgba(11, 34, 54, 0.72), rgba(4, 14, 24, 0.82));
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.65);
}

body[data-skin="win98"] .panel {
  background: var(--bevel-face); border-radius: 0; border-width: 2px; border-style: solid;
  border-color: var(--bevel-light) var(--bevel-dark) var(--bevel-dark) var(--bevel-light);
  box-shadow: none;
}
body[data-skin="win98"] .board-frame {
  background: var(--bevel-face); border-radius: 0; border-width: 2px; border-style: solid;
  border-color: var(--bevel-shadow) var(--bevel-light) var(--bevel-light) var(--bevel-shadow);
  box-shadow: none;
}
body[data-skin="winxp"] .panel {
  background: #ece9d8; border-radius: 6px; border: 1px solid #7ba2cc;
  box-shadow: 0 4px 10px rgba(0, 30, 70, 0.35);
}
body[data-skin="winxp"] .board-frame {
  background: #ffffff; border-radius: 5px; border: 2px solid #7ba2cc; box-shadow: none;
}
body[data-skin="win7"] .panel {
  background: linear-gradient(to bottom, rgba(255,255,255,0.92) 0%, rgba(226,240,252,0.82) 100%);
  border-radius: 8px; border: 1px solid rgba(255,255,255,0.95);
  box-shadow: 0 6px 16px rgba(0, 20, 45, 0.5);
}
body[data-skin="win7"] .board-frame {
  background: linear-gradient(to bottom, rgba(255,255,255,0.95), rgba(222,238,252,0.9));
  border-radius: 8px; border: 1px solid rgba(255,255,255,0.95);
  box-shadow: 0 6px 15px rgba(0, 20, 45, 0.45);
}
body[data-skin="macos"] .panel {
  background: #ffffff; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
}
body[data-skin="macos"] .board-frame {
  background: #ffffff; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08);
  box-shadow: 0 6px 17px rgba(0, 0, 0, 0.14);
}

/* Buttons */

button { font-family: inherit; border: 0; margin: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

.menu-button, .primary-button, .danger-button {
  font-size: 16px;
  font-weight: bold;
  border-radius: 10px;
  border: 1px solid rgba(255, 245, 220, 0.55);
  color: var(--button-ink);
  background: linear-gradient(to bottom, var(--button-top) 0%, var(--button-bottom) 100%);
  padding: 10px 22px;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.45);
  transition: background 0.12s ease, box-shadow 0.12s ease;
}
.menu-button:hover:not(:disabled) {
  background: linear-gradient(to bottom, var(--brass-bright) 0%, var(--brass) 100%);
  border-color: var(--brass-bright);
  box-shadow: 0 5px 14px rgba(224, 178, 90, 0.55);
}
.menu-button:active:not(:disabled) {
  background: linear-gradient(to bottom, var(--brass) 0%, var(--brass-deep) 100%);
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
}
.menu-button:disabled { opacity: 0.72; cursor: default; }

.primary-button {
  border-color: var(--brass-bright);
  background: linear-gradient(to bottom, var(--brass-bright) 0%, var(--brass) 100%);
  padding: 10px 24px;
  box-shadow: 0 5px 13px rgba(224, 178, 90, 0.45);
}
.primary-button:hover:not(:disabled) {
  background: linear-gradient(to bottom, color-mix(in srgb, #fff 18%, var(--brass-bright)) 0%, var(--brass-bright) 100%);
}
.primary-button:active:not(:disabled) { background: linear-gradient(to bottom, var(--brass) 0%, var(--brass-deep) 100%); }
.primary-button:disabled { opacity: 0.45; cursor: default; }

.danger-button {
  font-size: 15px;
  color: #fff3f3;
  border-color: rgba(255, 140, 140, 0.75);
  background: linear-gradient(to bottom, var(--danger) 0%, var(--danger-deep) 100%);
  box-shadow: 0 5px 14px rgba(229, 72, 77, 0.5);
}
.danger-button:hover:not(:disabled) {
  background: linear-gradient(to bottom, color-mix(in srgb, #fff 14%, var(--danger)) 0%, color-mix(in srgb, #fff 18%, var(--danger-deep)) 100%);
}
.danger-button:active:not(:disabled) {
  background: linear-gradient(to bottom, var(--danger-deep) 0%, color-mix(in srgb, #000 30%, var(--danger-deep)) 100%);
}
.danger-button:disabled { opacity: 0.5; cursor: default; }

.ready-button { background: linear-gradient(to bottom, var(--ready-top) 0%, var(--ready-bottom) 100%); border-color: var(--ready-edge); }
.pending-button { background: linear-gradient(to bottom, var(--brass-bright) 0%, var(--brass) 100%); border-color: var(--brass-bright); }

body[data-skin="win98"] .menu-button,
body[data-skin="win98"] .primary-button,
body[data-skin="win98"] .danger-button {
  background: var(--bevel-face); border-radius: 0; border-width: 2px; border-style: solid;
  border-color: var(--bevel-light) var(--bevel-dark) var(--bevel-dark) var(--bevel-light);
  color: #000; font-size: 12px; font-weight: normal; padding: 6px 18px; box-shadow: none; cursor: default;
}
body[data-skin="win98"] .menu-button:hover:not(:disabled),
body[data-skin="win98"] .primary-button:hover:not(:disabled),
body[data-skin="win98"] .danger-button:hover:not(:disabled) {
  background: #cdcdcd; border-color: var(--bevel-light) var(--bevel-dark) var(--bevel-dark) var(--bevel-light); box-shadow: none;
}
body[data-skin="win98"] .menu-button:active:not(:disabled),
body[data-skin="win98"] .primary-button:active:not(:disabled),
body[data-skin="win98"] .danger-button:active:not(:disabled) {
  background: var(--bevel-face); border-color: var(--bevel-dark) var(--bevel-light) var(--bevel-light) var(--bevel-dark); box-shadow: none;
}
body[data-skin="win98"] .menu-button:disabled,
body[data-skin="win98"] .primary-button:disabled,
body[data-skin="win98"] .danger-button:disabled { opacity: 1; color: #808080; }
body[data-skin="win98"] .primary-button { font-weight: bold; }
body[data-skin="win98"] .danger-button { color: #800000; }
body[data-skin="win98"] .ready-button { background: var(--bevel-face); color: #006000; font-weight: bold; }
body[data-skin="win98"] .pending-button { background: #dcdcdc; color: #000080; font-weight: bold; }

body[data-skin="winxp"] .menu-button,
body[data-skin="winxp"] .primary-button,
body[data-skin="winxp"] .danger-button {
  background: linear-gradient(to bottom, #ffffff 0%, #f2f0e4 45%, #ded9c3 100%);
  border-radius: 4px; border: 1px solid #7f9db9; color: #000; font-size: 12px; font-weight: normal;
  padding: 7px 18px; box-shadow: none; cursor: default;
}
body[data-skin="winxp"] .menu-button:hover:not(:disabled),
body[data-skin="winxp"] .primary-button:hover:not(:disabled),
body[data-skin="winxp"] .danger-button:hover:not(:disabled) {
  background: linear-gradient(to bottom, #ffffff 0%, #fdf4d0 45%, #f6d97a 100%); border-color: #e8a33d; box-shadow: none;
}
body[data-skin="winxp"] .menu-button:active:not(:disabled),
body[data-skin="winxp"] .primary-button:active:not(:disabled),
body[data-skin="winxp"] .danger-button:active:not(:disabled) { background: linear-gradient(to bottom, #ded9c3 0%, #f2f0e4 100%); }
body[data-skin="winxp"] .menu-button:disabled,
body[data-skin="winxp"] .primary-button:disabled,
body[data-skin="winxp"] .danger-button:disabled { opacity: 1; color: #9a9a9a; }
body[data-skin="winxp"] .primary-button { font-weight: bold; }
body[data-skin="winxp"] .danger-button { color: #9b1c1a; }
body[data-skin="winxp"] .ready-button { background: linear-gradient(to bottom, #d6f0b8 0%, #8cc45c 100%); border-color: #5c9c34; }
body[data-skin="winxp"] .pending-button { background: linear-gradient(to bottom, #ffffff 0%, #f6d97a 100%); border-color: #e8a33d; }

body[data-skin="win7"] .menu-button,
body[data-skin="win7"] .primary-button,
body[data-skin="win7"] .danger-button {
  background: linear-gradient(to bottom, #fdfefe 0%, #eef6fd 48%, #dbeaf7 52%, #cfe3f6 100%);
  border-radius: 4px; border: 1px solid #8fb4d4; color: #10202f; font-size: 13px; font-weight: normal;
  padding: 8px 20px; box-shadow: none; cursor: default;
}
body[data-skin="win7"] .menu-button:hover:not(:disabled),
body[data-skin="win7"] .primary-button:hover:not(:disabled),
body[data-skin="win7"] .danger-button:hover:not(:disabled) {
  background: linear-gradient(to bottom, #f4fbff 0%, #dcefff 48%, #bfe3ff 52%, #a8d8ff 100%);
  border-color: #4ea3ea; box-shadow: 0 0 9px rgba(90, 175, 240, 0.85);
}
body[data-skin="win7"] .menu-button:active:not(:disabled),

/* Below about 430px a 28px tile no longer fits, so the tile follows the viewport
   instead of stepping at fixed widths. The board costs, either side of the ten
   tiles: 9 gaps, the side axis and its 6px gutter, the wrap and frame padding,
   the frame border and the root padding — 70px in total, and the axis is itself
   0.62 of a tile, which is where the 10.62 divisor comes from. min() keeps the
   tile at 28px on anything wide enough, so desktop is untouched. */
@media (max-width: 900px) {
  :root {
    --tile: max(18px, min(28px, calc((100vw - 70px) / 10.62)));
    --axis: calc(var(--tile) * 0.62);
  }
}
@media (max-width: 420px) {
  .axis-label { font-size: 10px; }
  .section-title { font-size: 18px; }
}

   which beats scrolling a stacked pair through a 390px-tall window. */
@media (max-width: 900px) and (min-width: 700px) and (orientation: landscape) {
  .stack-on-phone { flex-direction: row !important; align-items: flex-start !important; }

 * ───────────────────────────────────────────────────────────────────────────── */

var SIZE = 10;

  { name: "CARRIER",    display: "Carrier",    size: 5 },

function shuffle(list) {
  for (var i = list.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var swap = list[i]; list[i] = list[j]; list[j] = swap;
  }
  return list;
}

function Board() {
  this.tiles = [];
  this.ships = [];
  this.randomized = false;
  for (var y = 0; y < SIZE; y++) {
    this.tiles.push([]);
    for (var x = 0; x < SIZE; x++) {
      this.tiles[y].push({ x: x, y: y, attacked: false, ship: null });
    }
  }
}

Board.prototype.getTile = function (x, y) { return this.tiles[y][x]; };
Board.prototype.isInBounds = function (x, y) { return x >= 0 && x < SIZE && y >= 0 && y < SIZE; };

Board.prototype.touchesAnotherShip = function (x, y) {
  for (var cy = y - 1; cy <= y + 1; cy++) {
    for (var cx = x - 1; cx <= x + 1; cx++) {
      if (this.isInBounds(cx, cy) && this.getTile(cx, cy).ship) return true;
    }
  }
  return false;
};

Board.prototype.canPlaceShip = function (type, startX, startY, orientation) {
  for (var i = 0; i < type.size; i++) {
    var x = startX + (orientation === HORIZONTAL ? i : 0);
    var y = startY + (orientation === VERTICAL ? i : 0);
    if (!this.isInBounds(x, y) || this.getTile(x, y).ship || this.touchesAnotherShip(x, y)) return false;
  }
  return true;
};

Board.prototype.placeShip = function (type, startX, startY, orientation) {
  if (this.isShipPlaced(type) || !this.canPlaceShip(type, startX, startY, orientation)) return false;
  var ship = { type: type, coordinates: [], hits: {} };
  for (var i = 0; i < type.size; i++) {
    var x = startX + (orientation === HORIZONTAL ? i : 0);
    var y = startY + (orientation === VERTICAL ? i : 0);
    ship.coordinates.push({ x: x, y: y });
    this.getTile(x, y).ship = ship;
  }
  this.ships.push(ship);
  return true;
};

Board.prototype.clear = function () {
  this.ships = [];
  this.randomized = false;
  for (var y = 0; y < SIZE; y++) {
    for (var x = 0; x < SIZE; x++) {
      this.tiles[y][x].ship = null;
      this.tiles[y][x].attacked = false;
    }
  }
};

Board.prototype.randomize = function () {
  this.clear();
  var types = shuffle(SHIP_TYPES.slice());
  for (var i = 0; i < types.length; i++) {
    var placed = false;
    while (!placed) {
      var x = Math.floor(Math.random() * SIZE);
      var y = Math.floor(Math.random() * SIZE);
      var orientation = Math.random() < 0.5 ? HORIZONTAL : VERTICAL;
      placed = this.placeShip(types[i], x, y, orientation);
    }
  }
  this.randomized = true;
};

Board.prototype.isShipPlaced = function (type) {
  return this.ships.some(function (ship) { return ship.type === type; });
};
Board.prototype.allShipsPlaced = function () { return this.ships.length === SHIP_TYPES.length; };
Board.prototype.allShipsSunk = function () { return this.ships.every(isSunk); };

function isSunk(ship) { return Object.keys(ship.hits).length === ship.coordinates.length; }

Board.prototype.receiveAttack = function (x, y) {
  if (!this.isInBounds(x, y)) {
    return { result: INVALID, sunkShip: false, gameOver: false, shipType: null, cleared: [] };
  }
  var tile = this.getTile(x, y);
  if (tile.attacked) {
    return { result: ALREADY_ATTACKED, sunkShip: false, gameOver: false, shipType: tile.ship ? tile.ship.type : null, cleared: [] };
  }
  tile.attacked = true;
  if (!tile.ship) {
    return { result: MISS, sunkShip: false, gameOver: false, shipType: null, cleared: [] };
  }
  var ship = tile.ship;
  ship.hits[x + "," + y] = true;
  var sunk = isSunk(ship);
  var gameOver = this.allShipsSunk();
  var cleared = sunk ? this.clearSurroundingWater(ship) : [];
  return { result: HIT, sunkShip: sunk, gameOver: gameOver, shipType: ship.type, cleared: cleared };
};

/* A sunk ship cannot touch another, so every square around it is known water. */
Board.prototype.clearSurroundingWater = function (ship) {
  var cleared = [];
  var seen = {};
  for (var i = 0; i < ship.coordinates.length; i++) {
    var c = ship.coordinates[i];
    for (var cy = c.y - 1; cy <= c.y + 1; cy++) {
      for (var cx = c.x - 1; cx <= c.x + 1; cx++) {
        if (!this.isInBounds(cx, cy)) continue;
        var tile = this.getTile(cx, cy);
        if (tile.ship || tile.attacked) continue;
        tile.attacked = true;
        var key = cx + "," + cy;
        if (!seen[key]) { seen[key] = true; cleared.push({ x: cx, y: cy }); }
      }
    }
  }
  return cleared;
};

/* ─────────────────────────────────────────────────────────────────────────────
 * ai.*
 * ───────────────────────────────────────────────────────────────────────────── */

var DIFFICULTIES = [
  { name: "EASY", display: "Easy", description: "Random shots only. Best for beginners." },
  { name: "MEDIUM", display: "Medium", description: "Targets adjacent tiles after a hit." },
  { name: "HARD", display: "Hard", description: "Tracks hit direction to sink ships efficiently." },
  { name: "NIGHTMARE", display: "Nightmare", description: "Parity hunting with precision line targeting. Nearly unbeatable." },
  { name: "US_NAVY", display: "US Navy", description: "Probability density targeting. Calculates the most likely ship location every turn. Plays near-perfectly." },
  { name: "ARMED_FORCES", display: "All of the US Armed Forces", description: "Every branch at once. Sweeps on the tightest pattern that cannot miss a ship, counts every placement still possible, and locks on hard the moment it draws blood. It never sees your board. It just never wastes a shot." }
];

function difficultyByName(name) {
  for (var i = 0; i < DIFFICULTIES.length; i++) if (DIFFICULTIES[i].name === name) return DIFFICULTIES[i];
  return DIFFICULTIES[1];
}

var UNSHOT = 0, S_MISS = 1, S_HIT = 2, S_SUNK = 3;
var STEPS = [[0, 1], [0, -1], [1, 0], [-1, 0]];

function BattleshipAI(difficulty) {
  this.difficulty = difficulty;
  this.attempted = [];
  this.shotResult = [];
  for (var y = 0; y < SIZE; y++) {
    this.attempted.push(new Array(SIZE).fill(false));
    this.shotResult.push(new Array(SIZE).fill(UNSHOT));
  }
  this.currentHits = [];
  this.direction = null;
  this.remainingShipSizes = SHIP_TYPES.map(function (t) { return t.size; });
}

BattleshipAI.prototype.nextShot = function () {
  var name = this.difficulty.name;
  if (name === "EASY") return this.markAttempted(this.randomUnshot());
  if (name === "US_NAVY" || name === "ARMED_FORCES") return this.markAttempted(this.probabilityShot());

  if (this.currentHits.length > 0) {
    var shot = this.getTargetShot();
    if (shot) return this.markAttempted(shot);
    this.currentHits = [];
    this.direction = null;
  }
  return this.markAttempted(this.getHuntShot());
};

BattleshipAI.prototype.getHuntShot = function () {
  if (this.difficulty.name === "NIGHTMARE") {
    var parity = [];
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        if (!this.attempted[y][x] && (x + y) % 2 === 0) parity.push({ x: x, y: y });
      }
    }
    if (parity.length > 0) return shuffle(parity)[0];
  }
  return this.randomUnshot();
};

BattleshipAI.prototype.getTargetShot = function () {
  if (this.difficulty.name === "MEDIUM") return this.anyAdjacentUnshot();
  if (this.direction) {
    var fwd = this.nextInDirection(this.direction[0], this.direction[1]);
    if (fwd) return fwd;
    var bwd = this.nextInDirection(-this.direction[0], -this.direction[1]);
    if (bwd) return bwd;
    this.direction = null;
  }
  return this.anyAdjacentUnshot();
};

/*
 * Counts, for every square, how many ways the ships still afloat could be lying across it,
 * and fires at the square that shows up in the most of them. All of the US Armed Forces
 * weights placements that explain a confirmed hit, and while hunting only sweeps the
 * tightest lattice the shortest surviving ship cannot fit through.
 */
BattleshipAI.prototype.probabilityShot = function () {
  var relentless = this.difficulty.name === "ARMED_FORCES";
  var prob = [];
  for (var i = 0; i < SIZE; i++) prob.push(new Array(SIZE).fill(0));

  for (var s = 0; s < this.remainingShipSizes.length; s++) {
    var shipSize = this.remainingShipSizes[s];
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x <= SIZE - shipSize; x++) this.score(prob, y, x, 0, 1, shipSize, relentless);
    }
    for (var y2 = 0; y2 <= SIZE - shipSize; y2++) {
      for (var x2 = 0; x2 < SIZE; x2++) this.score(prob, y2, x2, 1, 0, shipSize, relentless);
    }
  }

  var hunting = this.currentHits.length === 0;
  var stride = relentless && hunting ? this.shortestRemainingShip() : 1;

  var best = this.pick(prob, stride);
  if (best.length === 0 && stride > 1) best = this.pick(prob, 1);
  return best.length === 0 ? this.randomUnshot() : best[Math.floor(Math.random() * best.length)];
};

BattleshipAI.prototype.score = function (prob, y, x, dy, dx, size, weighted) {
  if (!this.placementValid(y, x, dy, dx, size)) return;
  var covered = this.hitsCovered(y, x, dy, dx, size);
  if (this.currentHits.length > 0 && covered === 0) return;
  var weight = weighted ? Math.pow(2, 2 * covered) : 1;
  for (var i = 0; i < size; i++) {
    var cy = y + i * dy, cx = x + i * dx;
    if (!this.attempted[cy][cx]) prob[cy][cx] += weight;
  }
};

BattleshipAI.prototype.pick = function (prob, stride) {
  var best = [];
  var bestScore = -1;
  for (var y = 0; y < SIZE; y++) {
    for (var x = 0; x < SIZE; x++) {
      if (this.attempted[y][x] || prob[y][x] === 0) continue;
      if (stride > 1 && (x + y) % stride !== 0) continue;
      if (prob[y][x] < bestScore) continue;
      if (prob[y][x] > bestScore) { bestScore = prob[y][x]; best = []; }
      best.push({ x: x, y: y });
    }
  }
  return best;
};

BattleshipAI.prototype.shortestRemainingShip = function () {
  var shortest = SIZE;
  for (var i = 0; i < this.remainingShipSizes.length; i++) shortest = Math.min(shortest, this.remainingShipSizes[i]);
  return Math.max(1, shortest);
};

BattleshipAI.prototype.hitsCovered = function (y, x, dy, dx, size) {
  var covered = 0;
  for (var h = 0; h < this.currentHits.length; h++) {
    var hit = this.currentHits[h];
    for (var i = 0; i < size; i++) {
      if (hit.y === y + i * dy && hit.x === x + i * dx) { covered++; break; }
    }
  }
  return covered;
};

BattleshipAI.prototype.placementValid = function (y, x, dy, dx, size) {
  for (var i = 0; i < size; i++) {
    var state = this.shotResult[y + i * dy][x + i * dx];
    if (state === S_MISS || state === S_SUNK) return false;
  }
  return true;
};

BattleshipAI.prototype.nextInDirection = function (dr, dc) {
  var extreme = this.extremeHit(dr, dc);
  if (!extreme) return null;
  var nr = extreme.y + dr, nc = extreme.x + dc;
  if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return null;
  if (this.attempted[nr][nc]) return null;
  return { x: nc, y: nr };
};

BattleshipAI.prototype.extremeHit = function (dr, dc) {
  var best = null, bestScore = -Infinity;
  for (var i = 0; i < this.currentHits.length; i++) {
    var h = this.currentHits[i];
    var score = h.y * dr + h.x * dc;
    if (score > bestScore) { bestScore = score; best = h; }
  }
  return best;
};

BattleshipAI.prototype.anyAdjacentUnshot = function () {
  var seen = {}, candidates = [];
  var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  for (var i = 0; i < this.currentHits.length; i++) {
    var h = this.currentHits[i];
    for (var d = 0; d < dirs.length; d++) {
      var nr = h.y + dirs[d][0], nc = h.x + dirs[d][1];
      var key = nr + "," + nc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && !this.attempted[nr][nc] && !seen[key]) {
        seen[key] = true;
        candidates.push({ x: nc, y: nr });
      }
    }
  }
  if (candidates.length === 0) return null;
  return shuffle(candidates)[0];
};

BattleshipAI.prototype.randomUnshot = function () {
  var available = [];
  for (var y = 0; y < SIZE; y++) {
    for (var x = 0; x < SIZE; x++) if (!this.attempted[y][x]) available.push({ x: x, y: y });
  }
  return shuffle(available)[0];
};

BattleshipAI.prototype.markAttempted = function (c) { this.attempted[c.y][c.x] = true; return c; };

BattleshipAI.prototype.handleShotResult = function (coordinate, outcome) {
  var hit = outcome.result === HIT;
  this.shotResult[coordinate.y][coordinate.x] = hit ? S_HIT : S_MISS;
  if (!hit) return;

  this.currentHits.push(coordinate);

  if (outcome.sunkShip) { this.retireSunkShip(coordinate, outcome); return; }
  if (this.difficulty.name === "EASY") return;

  var n = this.difficulty.name;
  if ((n === "HARD" || n === "NIGHTMARE" || n === "US_NAVY" || n === "ARMED_FORCES") && this.currentHits.length >= 2) {
    var first = this.currentHits[0];
    var last = this.currentHits[this.currentHits.length - 1];
    var dr = Math.sign(last.y - first.y);
    var dc = Math.sign(last.x - first.x);
    if (dr !== 0 || dc !== 0) this.direction = [dr, dc];
  }
};

/*
 * A ship has gone down. Its own squares can never hold another, and because ships never
 * touch, neither can the water cleared around it. Forgetting either leaves the probability
 * map piling shots onto wrecks it has already sunk.
 */
BattleshipAI.prototype.retireSunkShip = function (lastHit, outcome) {
  var shipTiles = this.connectedHits(lastHit);
  var self = this;
  var keys = {};
  shipTiles.forEach(function (tile) {
    self.shotResult[tile.y][tile.x] = S_SUNK;
    self.attempted[tile.y][tile.x] = true;
    keys[tile.x + "," + tile.y] = true;
  });
  outcome.cleared.forEach(function (water) {
    self.shotResult[water.y][water.x] = S_MISS;
    self.attempted[water.y][water.x] = true;
  });
  this.currentHits = this.currentHits.filter(function (h) { return !keys[h.x + "," + h.y]; });
  if (outcome.shipType) {
    var index = this.remainingShipSizes.indexOf(outcome.shipType.size);
    if (index >= 0) this.remainingShipSizes.splice(index, 1);
  }
  if (this.currentHits.length < 2) this.direction = null;
};

/* The hits joined to start edge to edge, which is exactly one ship since ships never touch. */
BattleshipAI.prototype.connectedHits = function (start) {
  var hits = {};
  this.currentHits.forEach(function (h) { hits[h.x + "," + h.y] = h; });
  var found = {}, queue = [start], out = [];
  found[start.x + "," + start.y] = true;
  out.push(start);
  while (queue.length > 0) {
    var c = queue.shift();
    for (var i = 0; i < STEPS.length; i++) {
      var key = (c.x + STEPS[i][1]) + "," + (c.y + STEPS[i][0]);
      if (hits[key] && !found[key]) { found[key] = true; queue.push(hits[key]); out.push(hits[key]); }
    }
  }
  return out;
};

function readStore(key, fallback) {
  try {
    var raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function writeStore(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* a nuisance, not a reason to stop */ }
}

var Settings = {
  masterVolume: 1.0, musicVolume: 0.8, effectsVolume: 1.0,
  displayMode: "WINDOWED", windowWidth: 1280, windowHeight: 800,
  acceptedTermsVersion: 0, theme: "NAVY",

  load: function () {
    var saved = readStore("battleshipjava.settings", null);
    if (!saved) return;
    var self = this;
    ["masterVolume", "musicVolume", "effectsVolume", "windowWidth", "windowHeight", "acceptedTermsVersion"].forEach(function (key) {
      if (typeof saved[key] === "number") self[key] = saved[key];
    });
    if (DISPLAY_MODES.some(function (m) { return m.name === saved.displayMode; })) this.displayMode = saved.displayMode;
    if (THEMES.some(function (t) { return t.name === saved.theme; })) this.theme = saved.theme;
  },
  save: function () {
    writeStore("battleshipjava.settings", {
      masterVolume: this.masterVolume, musicVolume: this.musicVolume, effectsVolume: this.effectsVolume,
      displayMode: this.displayMode, windowWidth: this.windowWidth, windowHeight: this.windowHeight,
      acceptedTermsVersion: this.acceptedTermsVersion, theme: this.theme
    });
  },
  getTheme: function () {
    for (var i = 0; i < THEMES.length; i++) if (THEMES[i].name === this.theme) return THEMES[i];
    return THEMES[0];
  },
  getDisplayMode: function () {
    for (var i = 0; i < DISPLAY_MODES.length; i++) if (DISPLAY_MODES[i].name === this.displayMode) return DISPLAY_MODES[i];
    return DISPLAY_MODES[0];
  },
  acceptTerms: function (version) { this.acceptedTermsVersion = version; this.save(); },
  musicLevel: function (track) { return clamp01(track * this.musicVolume * this.masterVolume); },
  effectsLevel: function (track) { return clamp01(track * this.effectsVolume * this.masterVolume); }
};

function clamp01(value) { return Math.max(0, Math.min(1, value)); }

var Statistics = {
  records: {}, shotsFired: 0, shotsHit: 0, currentStreak: 0, longestStreak: 0,

  load: function () {
    var saved = readStore("battleshipjava.statistics", null);
    DIFFICULTIES.forEach(function (d) { Statistics.records[d.name] = { played: 0, won: 0, bestShots: 0 }; });
    if (!saved) return;
    this.shotsFired = saved.shotsFired || 0;
    this.shotsHit = saved.shotsHit || 0;
    this.currentStreak = saved.currentStreak || 0;
    this.longestStreak = saved.longestStreak || 0;
    var self = this;
    DIFFICULTIES.forEach(function (d) {
      var record = saved.records && saved.records[d.name];
      if (record) self.records[d.name] = { played: record.played || 0, won: record.won || 0, bestShots: record.bestShots || 0 };
    });
  },
  save: function () {
    writeStore("battleshipjava.statistics", {
      records: this.records, shotsFired: this.shotsFired, shotsHit: this.shotsHit,
      currentStreak: this.currentStreak, longestStreak: this.longestStreak
    });
  },
  recordGame: function (difficulty, won, shotsThisGame, hitsThisGame) {
    if (!difficulty) return;
    var record = this.records[difficulty.name];
    record.played++;
    if (won) {
      record.won++;
      if (record.bestShots === 0 || shotsThisGame < record.bestShots) record.bestShots = shotsThisGame;
      this.currentStreak++;
      this.longestStreak = Math.max(this.longestStreak, this.currentStreak);
    } else {
      this.currentStreak = 0;
    }
    this.shotsFired += shotsThisGame;
    this.shotsHit += hitsThisGame;
    this.save();
  },
  recordFor: function (difficulty) { return this.records[difficulty.name]; },
  gamesPlayed: function () { var t = 0; for (var k in this.records) t += this.records[k].played; return t; },
  gamesWon: function () { var t = 0; for (var k in this.records) t += this.records[k].won; return t; },
  gamesLost: function () { return this.gamesPlayed() - this.gamesWon(); },
  winRate: function () { var p = this.gamesPlayed(); return p === 0 ? 0 : this.gamesWon() / p; },
  accuracy: function () { return this.shotsFired === 0 ? 0 : this.shotsHit / this.shotsFired; },
  highestCleared: function () {
    var best = null;
    for (var i = 0; i < DIFFICULTIES.length; i++) if (this.records[DIFFICULTIES[i].name].won > 0) best = DIFFICULTIES[i];
    return best;
  },
  reset: function () {
    var self = this;
    DIFFICULTIES.forEach(function (d) { self.records[d.name] = { played: 0, won: 0, bestShots: 0 }; });
    this.shotsFired = 0; this.shotsHit = 0; this.currentStreak = 0; this.longestStreak = 0;
    this.save();
  }
};

function achievementsIn(categoryName) {
  return ACHIEVEMENTS.filter(function (achievement) { return achievement.category === categoryName; });

var Achievements = {
  unlocked: {}, counters: {}, flags: {}, recentlyUnlocked: [],
  /* Reset every time the page loads, because the clause says "in a single session". */
  randomizePressesThisSession: 0,

  load: function () {
    var saved = readStore("battleshipjava.achievements", null) || {};
    /* Files written before there were counters held nothing but the unlocked flags. */
    if (saved.unlocked || saved.counters || saved.flags) {
      this.unlocked = saved.unlocked || {};
      this.counters = saved.counters || {};
      this.flags = saved.flags || {};
    } else {
      this.unlocked = saved;
    }
  },
  save: function () {
    writeStore("battleshipjava.achievements", { unlocked: this.unlocked, counters: this.counters, flags: this.flags });
  },

  isUnlocked: function (achievement) { return !!this.unlocked[achievement.name]; },
  unlockedCount: function () {
    var total = 0;
    for (var key in this.unlocked) if (this.unlocked[key]) total++;
    return total;
  },
  unlockedCountIn: function (categoryName) {
    var self = this;
    return achievementsIn(categoryName).filter(function (a) { return self.isUnlocked(a); }).length;
  },

  unlock: function (name) {
    if (this.unlocked[name]) return false;
    this.unlocked[name] = true;
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      if (ACHIEVEMENTS[i].name === name) this.recentlyUnlocked.push(ACHIEVEMENTS[i]);
    }
    this.save();
    return true;
  },
  unlockIf: function (condition, name) { if (condition) this.unlock(name); },

  bump: function (key) {
    this.counters[key] = (this.counters[key] || 0) + 1;
    this.save();
    return this.counters[key];
  },
  raiseFlag: function (key) {
    if (!this.flags[key]) { this.flags[key] = true; this.save(); }
  },

  // ── Things that happen outside a game ──────────────────────────────────

  themeChosen: function (themeName) {
    if (!themeName) return;
    this.raiseFlag("theme." + themeName);
    var byTheme = {
      CRIMSON: "WAR_ROOM", ABYSS: "DEEP_WATER", DAYLIGHT: "BLINDS_OPEN", SIGNAL: "SIGNAL_FLAGS",
      WIN98: "CRY_FOR_HELP", WINXP: "LUNA", WIN7: "AERO", MACOS: "CUPERTINO"
    };
    /* Navy is the default, so seeing it is not an achievement on its own. */
    if (byTheme[themeName]) this.unlock(byTheme[themeName]);
    for (var i = 0; i < THEMES.length; i++) {
      if (!this.flags["theme." + THEMES[i].name]) return;
    }
    this.unlock("INTERIOR_DECORATOR");
  },

  /* Randomize was pressed. Clause 3.4 of the terms takes an interest at forty. */
  boardRandomized: function () {
    this.randomizePressesThisSession++;
    this.unlockIf(this.randomizePressesThisSession >= 40, "FORTY_TIMES");
  },
  boardCleared: function () { this.unlockIf(this.bump("boards.cleared") >= 10, "SECOND_THOUGHTS"); },
  battleLogOpened: function () { this.unlock("KEEPING_RECORDS"); },
  statisticsErased: function () { this.unlock("CLEAN_SLATE"); },
  turnPassed: function () { this.unlock("AFTER_YOU"); },
  partyStarted: function (duringBattle) {
    this.unlock("DISCO");
    this.unlockIf(duringBattle, "DANCING_UNDER_FIRE");
  },
  gameHosted: function () {
    this.raiseFlag("hosted");
    this.unlock("HARBOUR_MASTER");
    this.unlockIf(!!this.flags["joined"], "BOTH_SIDES");
  },
  gameJoined: function () {
    this.raiseFlag("joined");
    this.unlock("GUEST_ABOARD");
    this.unlockIf(!!this.flags["hosted"], "BOTH_SIDES");
  },

  // ── A finished game ────────────────────────────────────────────────────

  /* Call this after the statistics for the game have been recorded; the lifetime checks read them. */
  evaluate: function (record) {
    if (!record) return;
    this.evaluateSurroundings(record);
    if (record.mode === "SINGLEPLAYER") { this.evaluateLifetime(record); this.evaluateOneGame(record); }
    else if (record.mode === "NETWORK") { this.evaluateNetwork(record); this.evaluateOneGame(record); }
    else this.evaluateLocal(record);
  },

  /* True of the room rather than the game, so it counts however you were playing. */
  evaluateSurroundings: function (record) {
    this.unlockIf(Settings.masterVolume === 0, "SILENT_RUNNING");
    this.unlockIf(Settings.masterVolume >= 1 && Settings.musicVolume >= 1 && Settings.effectsVolume >= 1, "FULL_BLAST");
    this.unlockIf(Settings.displayMode !== "WINDOWED", "BIG_SCREEN");

  },

  evaluateLifetime: function (record) {
    if (!record.difficulty) return;

    var played = Statistics.gamesPlayed();
    this.unlockIf(played >= 10, "FEET_WET");
    this.unlockIf(played >= 50, "VETERAN");
    this.unlockIf(played >= 100, "HUNDRED_SORTIES");
    this.unlockIf(played >= 500, "OLD_SALT");
    this.unlockIf(played >= 1000, "THOUSAND_YARD");

    var lost = Statistics.gamesLost();
    this.unlockIf(lost >= 1, "BAPTISM");
    this.unlockIf(lost >= 50, "THICK_SKIN");
    this.unlockIf(Statistics.accuracy() >= 0.5 && played >= 50, "STEADY_HAND");

    if (!record.won) return;

    var won = Statistics.gamesWon();
    this.unlock("FIRST_BLOOD");
    this.unlockIf(won >= 5, "SHAKEDOWN");
    this.unlockIf(won >= 10, "TEN_HULLS");
    this.unlockIf(won >= 25, "QUARTERDECK");
    this.unlockIf(won >= 50, "FIFTY_FATHOMS");
    this.unlockIf(won >= 100, "CENTURION");
    this.unlockIf(won >= 250, "FLEET_ADMIRAL");

    var streak = Statistics.currentStreak;
    this.unlockIf(streak >= 3, "HAT_TRICK");
    this.unlockIf(streak >= 5, "UNSINKABLE");
    this.unlockIf(streak >= 10, "ON_STATION");
    this.unlockIf(streak >= 20, "BLOCKADE");
    this.unlockIf(streak >= 50, "DYNASTY");
    this.unlockIf(Statistics.longestStreak >= 25, "IRON_STREAK");
    /* A streak of exactly one, on anything but your first game, means the last one was a loss. */
    this.unlockIf(streak === 1 && played > 1, "RIGHT_BACK_UP");

    var firstWin = {
      EASY: "SEA_TRIALS", MEDIUM: "BLUE_WATER", HARD: "HARD_APORT",
      NIGHTMARE: "NIGHT_WATCH", US_NAVY: "ADMIRAL", ARMED_FORCES: "JOINT_CHIEFS"
    };
    var tenWins = {
      EASY: "MILK_RUN", MEDIUM: "JOURNEYMAN", HARD: "HARD_LABOUR",
      NIGHTMARE: "SLEEPLESS", US_NAVY: "CAREER_OFFICER", ARMED_FORCES: "COMBINED_ARMS"
    };
    this.unlock(firstWin[record.difficulty.name]);
    for (var key in tenWins) {
      this.unlockIf(Statistics.records[key].won >= 10, tenWins[key]);
    }
    this.unlockIf(beatenEveryDifficulty(1), "ALL_HANDS");
    this.unlockIf(beatenEveryDifficulty(10), "FLAG_OFFICER");

    this.unlockIf(record.difficulty.name === "US_NAVY" && record.shipsLost === 0, "UNTOUCHABLE");
    this.unlockIf(record.difficulty.name === "ARMED_FORCES" && record.shipsLost === 0, "BEYOND_REASON");
    var topTwo = record.difficulty.name === "US_NAVY" || record.difficulty.name === "ARMED_FORCES";
    this.unlockIf(topTwo && !record.ballisticUsed, "OLD_FASHIONED");
  },

  evaluateOneGame: function (record) {

    this.unlockIf(record.firstShotHit, "OPENING_SALVO");
    this.unlockIf(record.firstThreeHits, "DEAD_RECKONING");

    this.unlockIf(record.longestHitStreak >= 12, "UNSTOPPABLE");
    this.unlockIf(record.longestMissStreak >= 10, "WIDE_OF_MARK");
    this.unlockIf(record.longestMissStreak >= 15, "WHERE_ARE_THEY");

    this.unlockIf(record.mostConsecutiveSinks >= 3, "TRIPLE_STRIKE");

    this.unlockIf(record.hitTopLeft, "TOP_LEFT");

    this.unlockIf(record.shots < 25, "CLAIRVOYANT");

    this.unlockIf(accuracy >= 0.85, "UNCANNY");
    this.unlockIf(record.shots > 0 && record.hits === record.shots, "NOT_ONE_WASTED");

    this.unlockIf(record.shipsLost === 0, "UNSCATHED");
    this.unlockIf(record.shipsLost === 1, "SCRATCHED_PAINT");
    this.unlockIf(record.shipsLost === 4, "EVEN_TRADE");
    this.unlockIf(record.shipsRemaining === 1, "LAST_STAND");
    this.unlockIf(record.shipsRemaining === 1 && record.lastShipDamaged, "CLOSE_RUN");
    this.unlockIf(record.enemyHitsTaken === 0, "GHOST_FLEET");
    this.unlockIf(!record.carrierEverHit, "THE_BIG_ONE");
    this.unlockIf(!record.destroyerEverHit, "LITTLE_SHIP");

    this.unlockIf(record.ballisticEarned && !record.ballisticUsed, "HELD_IN_RESERVE");
    this.unlockIf(record.wonWithBallistic, "DECISIVE_STRIKE");

    this.unlockIf(record.everyShipOnEdge, "HUGGING_THE_COAST");
    this.unlockIf(record.noShipOnEdge, "OPEN_WATER");
    this.unlockIf(record.allHorizontal, "BROADSIDE");
    this.unlockIf(record.allVertical, "LINE_ASTERN");
    this.unlockIf(record.withinOneHalf, "HUDDLE");
    this.unlockIf(record.shipInEveryQuarter, "DISPERSED");
    this.unlockIf(record.shipInEveryCorner, "CORNER_OFFICE");
    this.unlockIf(record.randomizedBoard, "LEAVE_IT_TO_FATE");
    this.unlockIf(!record.randomizedBoard, "HAND_PLACED");

    this.unlockIf(record.turnsPassed > 0, "GRACIOUS");
    this.unlockIf(record.durationMillis > 0 && record.durationMillis < 180000, "QUICK_WORK");
  },

  evaluateLocal: function (record) {
    this.unlock("HOT_SEAT");
    this.unlockIf(this.bump("local.games") >= 10, "PASSING_THE_LAPTOP");
    this.unlockIf(record.won && record.shipsLost === 0, "TABLE_MANNERS");
  },

  evaluateNetwork: function (record) {
    this.unlockIf(this.bump("network.games") >= 10, "FLEET_ACTION");
    this.unlockIf(record.won, "SHIP_TO_SHIP");
    this.unlockIf(record.won && record.shipsLost === 0, "NOTHING_PERSONAL");
  },

  takeRecentlyUnlocked: function () { var taken = this.recentlyUnlocked.slice(); this.recentlyUnlocked = []; return taken; },
  reset: function () {
    this.unlocked = {}; this.counters = {}; this.flags = {}; this.recentlyUnlocked = [];
    this.randomizePressesThisSession = 0;
    this.save();
  }
};

function beatenEveryDifficulty(wins) {
  return DIFFICULTIES.every(function (difficulty) { return Statistics.records[difficulty.name].won >= wins; });
}

/* Allowing for the two ships of three, which can go down in either order. */
function sunkInSizeOrder(sinkOrder, descending) {
  if (sinkOrder.length !== SHIP_TYPES.length) return false;
  for (var i = 1; i < sinkOrder.length; i++) {
    var previous = sinkOrder[i - 1].size;
    var current = sinkOrder[i].size;
    if (descending ? current > previous : current < previous) return false;
  }
  return true;
}

/* ─────────────────────────────────────────────────────────────────────────────
 * audio.AudioManager — the desktop build plays mp3s. A page cannot carry 24 MB
 * of them, so the same cues are synthesised: same names, same moments, same
 * volume model of master x music and master x effects.
 * ───────────────────────────────────────────────────────────────────────────── */

var Audio = {
  ctx: null, master: null, musicBus: null, effectsBus: null,
  menuNodes: null, endNodes: null, partyNodes: null, fireNode: null, partyOnEnd: null, partyTimer: null,

  init: function () {
    if (this.ctx) return this.ctx;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try { this.ctx = new Ctor(); } catch (e) { return null; }
    this.master = this.ctx.createGain();
    this.master.connect(this.ctx.destination);
    this.musicBus = this.ctx.createGain();
    this.effectsBus = this.ctx.createGain();
    this.musicBus.connect(this.master);
    this.effectsBus.connect(this.master);
    this.refreshVolumes();
    return this.ctx;
  },
  resume: function () {
    var ctx = this.init();
    if (ctx && ctx.state === "suspended") ctx.resume();
  },
  refreshVolumes: function () {
    if (!this.ctx) return;
    this.master.gain.value = Settings.masterVolume;
    this.musicBus.gain.value = Settings.musicVolume;
    this.effectsBus.gain.value = Settings.effectsVolume;
  },
  noiseBuffer: function (seconds) {
    var frames = Math.floor(this.ctx.sampleRate * seconds);
    var buffer = this.ctx.createBuffer(1, frames, this.ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  },
  tone: function (opts) {
    var ctx = this.init();
    if (!ctx) return null;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = opts.type || "sine";
    var now = ctx.currentTime + (opts.delay || 0);
    osc.frequency.setValueAtTime(opts.from, now);
    if (opts.to && opts.to !== opts.from) osc.frequency.exponentialRampToValueAtTime(opts.to, now + opts.duration);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, opts.level), now + Math.min(0.04, opts.duration / 3));
    gain.gain.exponentialRampToValueAtTime(0.0001, now + opts.duration);
    osc.connect(gain);
    gain.connect(opts.bus || this.effectsBus);
    osc.start(now);
    osc.stop(now + opts.duration + 0.05);
    return osc;
  },

  playSelect: function () { this.tone({ type: "square", from: 880, to: 1320, duration: 0.07, level: 0.12 }); },

  /* A shell on its way: a falling whistle that runs the length of the drop. */
  playFire: function () {
    var ctx = this.init();
    if (!ctx) return;
    this.stopFire();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    var now = ctx.currentTime;
    osc.frequency.setValueAtTime(1400, now);
    osc.frequency.exponentialRampToValueAtTime(320, now + 0.95);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.16, now + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
    osc.connect(gain); gain.connect(this.effectsBus);
    osc.start(now); osc.stop(now + 1.05);
    this.fireNode = osc;
  },
  stopFire: function () {
    if (this.fireNode) { try { this.fireNode.stop(); } catch (e) {} this.fireNode = null; }
  },

  playExplosion: function () {
    var ctx = this.init();
    if (!ctx) return;
    var source = ctx.createBufferSource();
    source.buffer = this.noiseBuffer(1.1);
    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    var now = ctx.currentTime;
    filter.frequency.setValueAtTime(1800, now);
    filter.frequency.exponentialRampToValueAtTime(90, now + 0.9);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.55, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
    source.connect(filter); filter.connect(gain); gain.connect(this.effectsBus);
    source.start(now); source.stop(now + 1.1);
    this.tone({ type: "sine", from: 120, to: 40, duration: 0.5, level: 0.4 });
  },

  /* The bosun's call that answers an order. */
  playSirYesSir: function () {
    this.tone({ type: "triangle", from: 700, to: 1180, duration: 0.16, level: 0.16 });
    this.tone({ type: "triangle", from: 1180, to: 1180, duration: 0.1, level: 0.14, delay: 0.18 });
    this.tone({ type: "triangle", from: 900, to: 1400, duration: 0.3, level: 0.15, delay: 0.32 });
  },

  playInternet: function () {
    this.tone({ type: "sawtooth", from: 220, to: 180, duration: 0.22, level: 0.14 });
    this.tone({ type: "sawtooth", from: 165, to: 130, duration: 0.34, level: 0.14, delay: 0.24 });
  },

  playBallistic: function () {
    for (var i = 0; i < 3; i++) {
      this.tone({ type: "sawtooth", from: 300, to: 900, duration: 0.45, level: 0.12, delay: i * 0.5 });
      this.tone({ type: "sawtooth", from: 900, to: 300, duration: 0.45, level: 0.12, delay: i * 0.5 + 0.45 });
    }
  },

  /* Music: slow chords under the menu, a short figure at the end of a game. */
  chordLoop: function (chords, secondsPerChord, level, bus) {
    var ctx = this.init();
    if (!ctx) return null;
    var stopped = false;
    var voices = [];
    var index = 0;
    var self = this;
    function step() {
      if (stopped) return;
      var chord = chords[index % chords.length];
      index++;
      chord.forEach(function (freq) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        var now = ctx.currentTime;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(level, now + secondsPerChord * 0.35);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + secondsPerChord);
        osc.connect(gain); gain.connect(bus || self.musicBus);
        osc.start(now); osc.stop(now + secondsPerChord + 0.1);
        voices.push(osc);
      });
      voices = voices.slice(-24);
      timer = window.setTimeout(step, secondsPerChord * 1000);
    }
    var timer = null;
    step();
    return { stop: function () { stopped = true; window.clearTimeout(timer); voices.forEach(function (v) { try { v.stop(); } catch (e) {} }); } };
  },

  playMenuMusic: function () {
    this.stopEndMusic();
    if (this.menuNodes) return;
    /* Nothing is scheduled into a context the browser has not started yet. */
    var ctx = this.init();
    if (!ctx || ctx.state !== "running") return;
    this.menuNodes = this.chordLoop(
      [[110, 164.81, 220], [98, 146.83, 196], [123.47, 185, 246.94], [87.31, 130.81, 174.61]], 4.2, 0.055);
  },
  stopMenuMusic: function () { if (this.menuNodes) { this.menuNodes.stop(); this.menuNodes = null; } },

  playVictoryMusic: function () {
    this.stopMenuMusic(); this.stopEndMusic();
    var notes = [261.63, 329.63, 392, 523.25, 392, 523.25];
    var self = this;
    notes.forEach(function (freq, i) {
      self.tone({ type: "triangle", from: freq, to: freq, duration: 0.42, level: 0.13, delay: i * 0.22, bus: self.musicBus });
    });
    this.endNodes = this.chordLoop([[130.81, 196, 261.63], [174.61, 261.63, 349.23]], 3.4, 0.05);
  },
  playLossMusic: function () {
    this.stopMenuMusic(); this.stopEndMusic();
    var notes = [246.94, 233.08, 220, 174.61];
    var self = this;
    notes.forEach(function (freq, i) {
      self.tone({ type: "sine", from: freq, to: freq, duration: 0.7, level: 0.12, delay: i * 0.42, bus: self.musicBus });
    });
    this.endNodes = this.chordLoop([[110, 130.81, 164.81], [98, 116.54, 155.56]], 4.6, 0.045);
  },
  stopEndMusic: function () { if (this.endNodes) { this.endNodes.stop(); this.endNodes = null; } },

  playParty: function (onEnd) {
    this.stopMenuMusic();
    this.stopEndMusic();
    this.partyOnEnd = onEnd;
    var ctx = this.init();
    if (!ctx) { return false; }
    this.partyNodes = this.chordLoop(
      [[146.83, 220, 293.66], [164.81, 246.94, 329.63], [130.81, 196, 261.63], [174.61, 261.63, 349.23]], 0.55, 0.07);
    var self = this;
    var beat = 0;
    this.partyBeat = window.setInterval(function () {
      self.tone({ type: "square", from: beat % 4 === 0 ? 90 : 160, to: 60, duration: 0.12, level: 0.1, bus: self.musicBus });
      beat++;
    }, 275);
    this.partyTimer = window.setTimeout(function () { self.stopParty(); if (onEnd) onEnd(); }, 26000);
    return true;
  },
  isPartyPlaying: function () { return !!this.partyNodes; },
  stopParty: function () {
    if (this.partyNodes) { this.partyNodes.stop(); this.partyNodes = null; }
    if (this.partyTimer) { window.clearTimeout(this.partyTimer); this.partyTimer = null; }
    if (this.partyBeat) { window.clearInterval(this.partyBeat); this.partyBeat = null; }
  }
};

/* ─────────────────────────────────────────────────────────────────────────────
 * ui.UiFactory — the pieces more than one screen needs. Appearance stays in the
 * stylesheet; this only says what a node is.
 * ───────────────────────────────────────────────────────────────────────────── */

var COLUMN_LABELS = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"];
var TILE_STYLES = { WATER: "tile-water", SHIP: "tile-ship", HIT: "tile-hit", MISS: "tile-miss" };

function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}
function vbox(gap, children) {
  var node = el("div", "vbox");
  node.style.gap = gap + "px";
  (children || []).forEach(function (child) { if (child) node.appendChild(child); });
  return node;
}
function hbox(gap, children) {
  var node = el("div", "hbox");
  node.style.gap = gap + "px";
  (children || []).forEach(function (child) { if (child) node.appendChild(child); });
  return node;
}
function centered(node) { node.style.alignItems = "center"; return node; }

function createScreenTitle(text) { return el("div", "screen-title", text); }
function createSectionTitle(text) { return el("div", "section-title", text); }

function createMenuButton(text, action) {
  var button = el("button", "menu-button", text);
  button.style.width = "260px";
  button.style.height = "50px";
  button.addEventListener("click", function () {
    if (button.disabled) return;
    Audio.resume();
    Audio.playSelect();
    action();
  });
  return button;
}

function createGridButton() {
  var button = el("button", "grid-tile");
  button.type = "button";
  styleGridButton(button, TILE_STYLES.WATER, "");
  return button;
}

function styleGridButton(button, style, text) {
  button.textContent = text;
  button.classList.remove("tile-water", "tile-ship", "tile-hit", "tile-miss", "tile-target", "tile-preview-ok", "tile-preview-bad");
  button.classList.add(style);
}
function markPreviewTile(button, legal) {
  button.classList.remove("tile-preview-ok", "tile-preview-bad");
  button.classList.add(legal ? "tile-preview-ok" : "tile-preview-bad");
}
function styleSelectedTargetButton(button) { button.classList.add("tile-target"); }

function wrapWithCoordinates(boardGrid) {
  var wrapper = el("div", "board-wrap");
  /* The axis labels line up only if they use the same gap as the grid beside them. */
  var gap = boardGrid.style.getPropertyValue("--grid-gap");
  if (gap) wrapper.style.setProperty("--grid-gap", gap);
  wrapper.appendChild(el("div", "corner"));

  var topLabels = el("div", "axis-top");
  COLUMN_LABELS.forEach(function (label) { topLabels.appendChild(el("div", "axis-label", label)); });
  wrapper.appendChild(topLabels);

  var sideLabels = el("div", "axis-side");
  for (var i = 1; i <= COLUMN_LABELS.length; i++) sideLabels.appendChild(el("div", "axis-label", String(i)));
  wrapper.appendChild(sideLabels);

  wrapper.appendChild(boardGrid);
  return wrapper;
}

function createLegend(entries) {
  var box = vbox(5, []);
  entries.forEach(function (entry) {
    var swatch = el("div", "legend-swatch " + entry.style);
    var text = el("div", "muted-text", entry.description);
    var row = hbox(10, [swatch, text]);
    row.style.alignItems = "center";
    box.appendChild(row);
  });
  return box;
}

function createBoardSection(title, boardGrid, legend) {
  var frame = el("div", "board-frame");
  frame.appendChild(wrapWithCoordinates(boardGrid));
  var section = vbox(10, [createSectionTitle(title), frame, legend]);
  section.style.alignItems = "center";
  return section;
}

function createBoardGrid(gap) {
  var grid = el("div", "board-grid");
  grid.style.setProperty("--grid-gap", gap + "px");
  return grid;
}

/* ── Scene plumbing ── */

var screenHost = document.getElementById("screen");
var effectsLayer = document.getElementById("effects");
var currentKeyHandler = null;

function setScene(node, keyHandler) {
  screenHost.innerHTML = "";
  screenHost.appendChild(node);
  currentKeyHandler = keyHandler || null;
  window.scrollTo(0, 0);
  applyDisplaySettings();
}

function applyTheme() {
  document.body.setAttribute("data-skin", Settings.getTheme().skin);
}

function applyDisplaySettings() {
  screenHost.style.width = "100%";
  screenHost.style.maxWidth = Settings.displayMode === "WINDOWED" ? Settings.windowWidth + "px" : "100%";
}

function requestDisplayMode() {
  var wantFullscreen = Settings.displayMode !== "WINDOWED";
  try {
    if (wantFullscreen && !document.fullscreenElement && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function () { /* the browser may say no */ });
    } else if (!wantFullscreen && document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(function () { });
    }
  } catch (e) { /* not available here */ }
  applyDisplaySettings();
}

/* ─────────────────────────────────────────────────────────────────────────────
 * ui.MainMenuScene
 * ───────────────────────────────────────────────────────────────────────────── */

function showMainMenu() {
  if (activeSetup) { activeSetup.shutdown(); activeSetup = null; }
  Audio.stopEndMusic();
  Audio.playMenuMusic();

  var brandBox = vbox(2, [
    shipGraphic(Settings.getTheme().brand),
    createScreenTitle("Battleship"),
    el("div", "brand-tagline", "Place your fleet, read the water, and sink theirs first.")
  ]);
  brandBox.style.alignItems = "center";
  brandBox.style.textAlign = "center";

  var content = vbox(14, [
    brandBox,
    createMenuButton("Play vs AI", function () { showSetup("SINGLEPLAYER", 1); }),
    createMenuButton("Local Multiplayer", function () { showSetup("LOCAL", 1); }),
    createMenuButton("Host Game", function () { showNetworkSetupIfOnline("HOST"); }),
    createMenuButton("Join Game", function () { showNetworkSetupIfOnline("JOIN"); }),
    createMenuButton("Statistics", showStats),
    createMenuButton("Settings", showSettings),
    createMenuButton("Quit Battleship", quitGame)
  ]);
  content.style.alignItems = "center";
  content.style.padding = "10px 0 20px";

  /* The party code has no keyboard on a phone, so the silhouette answers a long press. */
  var pressTimer = null;
  brandBox.addEventListener("pointerdown", function () {
    pressTimer = window.setTimeout(function () { toggleParty(); }, 1600);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (event) {
    brandBox.addEventListener(event, function () { window.clearTimeout(pressTimer); });
  });

  setScene(content);
}

function quitGame() {
  var panel = vbox(16, [
    el("div", "section-title", "Thanks for playing"),
    el("div", "body-text", "A page cannot close a window it did not open. Close this tab to leave, or carry on below.")
  ]);
  panel.className = "vbox alert-panel";
  panel.style.gap = "16px";
  panel.style.padding = "28px";
  panel.style.alignItems = "center";
  panel.style.textAlign = "center";
  panel.style.maxWidth = "460px";
  var overlay = el("div", "turn-overlay");
  var back = createMenuButton("Back to menu", function () { overlay.remove(); });
  back.style.width = "200px";
  panel.appendChild(back);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}

/* ─────────────────────────────────────────────────────────────────────────────
 * ui.EndScene
 * ───────────────────────────────────────────────────────────────────────────── */

function showEndScene(titleText, messageText) {
  if (titleText.toLowerCase() === "victory") Audio.playVictoryMusic();
  else if (titleText.toLowerCase() === "defeat" || titleText.toLowerCase() === "loss") Audio.playLossMusic();
  else Audio.stopEndMusic();

  var message = el("div", null, messageText);
  message.style.color = "var(--parchment)";
  message.style.fontFamily = "var(--font-serif)";
  message.style.fontSize = "20px";
  message.style.maxWidth = "600px";
  message.style.textAlign = "center";

  var content = vbox(18, [createScreenTitle(titleText), message]);
  content.style.alignItems = "center";
  content.style.textAlign = "center";
  content.style.padding = "20px 0 40px";
  content.style.maxWidth = "700px";

  var unlocked = Achievements.takeRecentlyUnlocked();
  if (unlocked.length > 0) {
    var panel = vbox(8, [el("div", "section-title", unlocked.length === 1 ? "Achievement unlocked" : "Achievements unlocked")]);
    unlocked.forEach(function (achievement) {
      panel.appendChild(el("div", "achievement-unlocked", achievement.display + " — " + achievement.description));
    });
    panel.classList.add("panel");
    panel.style.padding = "16px 22px 18px";
    panel.style.maxWidth = "620px";
    panel.style.alignItems = "center";
    panel.style.textAlign = "center";
    content.appendChild(panel);
  }

  content.appendChild(createMenuButton("Main Menu", function () { Audio.stopEndMusic(); showMainMenu(); }));
  content.appendChild(createMenuButton("Exit", function () { Audio.stopEndMusic(); quitGame(); }));

function showTerms() {
  var title = createScreenTitle("Terms of Service");

  var preamble = el("div", "body-text", "Please read the following in full. It runs to seven parts and forty-six clauses, which is longer than it was and considerably shorter than the one you agreed to this morning without reading a word of.");
  preamble.style.maxWidth = "760px";

  var body = vbox(10, []);
  body.style.padding = "4px 18px 4px 4px";
  TERMS_PARTS.forEach(function (part, index) {
    var heading = el("div", "terms-part", part[0]);
    heading.style.marginTop = index === 0 ? "0" : "14px";
    heading.style.marginBottom = "2px";
    body.appendChild(heading);
    for (var i = 1; i < part.length; i++) {
      var clause = el("div", "muted-text", part[i]);
      clause.style.maxWidth = "720px";
      body.appendChild(clause);
    }
  });

  var scroller = el("div", "terms-scroll");
  scroller.style.height = "330px";
  scroller.style.maxWidth = "770px";
  scroller.style.width = "100%";
  scroller.appendChild(body);

  var agree = createMenuButton("I Agree", function () {
    Settings.acceptTerms(TERMS_VERSION);
    showMainMenu();
  });
  agree.classList.remove("menu-button");
  agree.classList.add("primary-button");
  agree.disabled = true;

  var hint = el("div", "muted-text", "Scroll to the end of the terms to continue.");

  function checkScrolled() {
    var reachedEnd = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 6;
    if (reachedEnd && agree.disabled) {
      agree.disabled = false;
      hint.textContent = "Thank you for reading the terms. Nobody ever does.";
      Achievements.unlock("LEGAL_SCHOLAR");
    }
  }
  scroller.addEventListener("scroll", checkScrolled);

  var decline = createMenuButton("Decline", function () { quitGame(); });
  decline.classList.remove("menu-button");
  decline.classList.add("danger-button");

  var buttons = hbox(16, [agree, decline]);
  buttons.style.justifyContent = "center";
  buttons.style.flexWrap = "wrap";

  var content = vbox(16, [title, preamble, scroller, hint, buttons]);
  content.style.alignItems = "center";
  content.style.textAlign = "center";
  content.style.maxWidth = "800px";
  content.style.padding = "12px 0";

  setScene(content);
  /* A viewport tall enough to show everything at once has nothing to scroll. */
  window.setTimeout(function () { if (scroller.scrollHeight <= scroller.clientHeight + 6) agree.disabled = false; }, 60);
}

function labelledRow(labelText, control) {

function comboBox(items, selectedName, onChange) {
  var select = el("select", "combo-box");
  select.style.width = "280px";
  select.style.maxWidth = "100%";
  items.forEach(function (item) {
    var option = el("option", null, item.display !== undefined ? item.display : String(item));
    option.value = item.name !== undefined ? item.name : String(item);
    select.appendChild(option);
  });
  select.value = selectedName;
  select.addEventListener("change", function () { onChange(select.value); });
  return select;
}

/* ─────────────────────────────────────────────────────────────────────────────
 * network.*  — the desktop build finds its opponent over the LAN with a six
 * character code. A page cannot open a socket, so the same handshake runs over
 * the artifact's live room: same code alphabet, same length, same messages.
 * ───────────────────────────────────────────────────────────────────────────── */

var CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";  /* no 0/O, no 1/I */
var CODE_LENGTH = 6;

function generateCode() {
  var code = "";
  for (var i = 0; i < CODE_LENGTH; i++) code += CODE_CHARS.charAt(Math.floor(Math.random() * CODE_CHARS.length));
  return code;
}

/*
 * Finding the other player.
 *
 * The desktop build opens a socket on the LAN. A page cannot, so this uses whichever of two
 * transports the page happens to be served by, and the six-character code works the same on
 * both. On claude.ai the artifact's live room carries the messages. On the Cloudflare Worker
 * the Worker does, over a WebSocket into a Durable Object named after the code. If neither is
 * there — opened from a file, or offline — network play is simply not offered, and Host and
 * Join say so rather than hanging.
 */
var Net = {
  mode: null, room: null, pending: null,

  detect: function () {
    if (this.pending) return this.pending;
    this.pending = (window.claude && window.claude.use ? window.claude.use("room") : Promise.resolve(null))
      .then(function (room) {
        if (room) { Net.room = room; Net.mode = "room"; return "room"; }
        return Net.probeWorker();
      })
      ["catch"](function () { return Net.probeWorker(); });
    return this.pending;
  },

  /* The Worker answers this; anywhere else it fails or 404s, which is the answer too. */
  probeWorker: function () {
    if (location.protocol !== "http:" && location.protocol !== "https:") return Promise.resolve(null);
    return fetch("ws-check", { cache: "no-store" })
      .then(function (response) {
        Net.mode = response.ok ? "socket" : null;
        return Net.mode;
      })
      ["catch"](function () { return null; });
  }
};

/** Opens a channel for one join code. Resolves to {send, close}, or null if there is no transport. */
function openChannel(code, onMessage) {
  return Net.detect().then(function (mode) {
    if (mode === "room") {
      var off = Net.room.on("bs", function (event) {
        onMessage(event && event.data ? event.data : event);
      });
      if (Net.room.presence) {
        try { Net.room.presence({ code: code }); } catch (e) { /* presence is a nicety here */ }
      }
      return {
        send: function (message) { Net.room.emit("bs", message); },
        close: function () { if (typeof off === "function") off(); }
      };
    }

    if (mode === "socket") {
      return new Promise(function (resolve) {
        var scheme = location.protocol === "https:" ? "wss://" : "ws://";
        var socket;
        try {
          socket = new WebSocket(scheme + location.host + "/ws?code=" + encodeURIComponent(code));
        } catch (e) {
          resolve(null);
          return;
        }
        var queue = [];
        socket.addEventListener("open", function () {
          queue.forEach(function (message) { socket.send(JSON.stringify(message)); });
          queue = [];
        });
        socket.addEventListener("message", function (event) {
          try { onMessage(JSON.parse(event.data)); } catch (e) { /* not ours */ }
        });
        resolve({
          send: function (message) {
            if (socket.readyState === 1) socket.send(JSON.stringify(message));
            else if (socket.readyState === 0) queue.push(message);
          },
          close: function () { try { socket.close(); } catch (e) { } }
        });
      });
    }

    return null;
  });
}

function NetworkGameSession(listener) {
  this.listener = listener;
  this.id = "p" + Math.random().toString(36).slice(2, 10);
  this.code = null;
  this.role = null;
  this.peerId = null;
  this.connected = false;
  this.closed = false;
  this.channel = null;
  this.channelPromise = null;
  this.joinTimer = null;
}

NetworkGameSession.prototype.send = function (kind, payload) {
  var self = this;
  if (!this.channelPromise) return;
  this.channelPromise.then(function (channel) {
    if (!channel || self.closed) return;
    var message = { kind: kind, code: self.code, from: self.id, to: self.peerId };
    for (var key in payload) message[key] = payload[key];
    try { channel.send(message); } catch (e) { /* a dropped moment is not fatal here */ }
  });
};

NetworkGameSession.prototype.listen = function () {
  var self = this;
  this.channelPromise = openChannel(this.code, function (message) {
    if (!message || message.code !== self.code || message.from === self.id) return;
    if (message.to && message.to !== self.id) return;
    self.receive(message);
  });
  return this.channelPromise.then(function (channel) {
    if (!channel) {
      self.listener.onError("Network multiplayer is not available here.");
      return null;
    }
    self.channel = channel;
    return channel;
  });
};

NetworkGameSession.prototype.receive = function (message) {
  var listener = this.listener;
  switch (message.kind) {
    case "join":
      if (this.role !== "host" || this.connected) return;
      this.peerId = message.from;
      this.connected = true;
      this.send("accept", {});
      listener.onConnected();
      break;
    case "accept":
      if (this.role !== "join" || this.connected) return;
      window.clearTimeout(this.joinTimer);
      this.peerId = message.from;
      this.connected = true;
      listener.onConnected();
      break;
    case "ready":
      this.remoteReady = true;
      listener.onRemoteReady();
      if (this.localReady && this.role === "host") this.startGame();
      break;
    case "start":
      listener.onGameStart(!message.hostFirst);
      break;
    case "attack": listener.onAttackReceived(message.x, message.y); break;
    case "result": listener.onAttackResult(!!message.hit); break;
    case "turn": listener.onTurnGranted(); break;
    case "win": listener.onLose(); break;
    case "lose": listener.onWin(); break;
    case "bye": listener.onDisconnected("The other player left the game."); break;
  }
};

NetworkGameSession.prototype.host = function () {
  this.role = "host";
  this.code = generateCode();
  var self = this;
  this.listen().then(function (room) {
    if (room) self.listener.onWaitingForOpponent("Waiting for a player to connect. Share the code above.");
  });
};

NetworkGameSession.prototype.joinWithCode = function (code) {
  this.role = "join";
  this.code = code;
  var self = this;
  this.listen().then(function (room) {
    if (!room) return;
    self.listener.onWaitingForOpponent("Looking for game " + code + "...");
    self.send("join", {});
    self.joinTimer = window.setTimeout(function () {
      if (!self.connected) self.listener.onError("No game found with that code. Check it and try again.");
    }, 12000);
  });
};

NetworkGameSession.prototype.sendReady = function () {
  this.localReady = true;
  this.send("ready", {});
  if (this.remoteReady && this.role === "host") this.startGame();
};

NetworkGameSession.prototype.startGame = function () {
  var hostFirst = Math.random() < 0.5;
  this.send("start", { hostFirst: hostFirst });
  this.listener.onGameStart(hostFirst);
};

NetworkGameSession.prototype.sendAttack = function (x, y) { this.send("attack", { x: x, y: y }); };
NetworkGameSession.prototype.sendResult = function (hit) { this.send("result", { hit: hit }); };
NetworkGameSession.prototype.sendTurn = function () { this.send("turn", {}); };
NetworkGameSession.prototype.sendWin = function () { this.send("win", {}); };
NetworkGameSession.prototype.sendLose = function () { this.send("lose", {}); };
NetworkGameSession.prototype.isConnected = function () { return this.connected; };
NetworkGameSession.prototype.close = function () {
  if (this.closed) return;
  this.closed = true;
  if (this.connected) this.send("bye", {});
  window.clearTimeout(this.joinTimer);
  if (this.channel) { try { this.channel.close(); } catch (e) { } }
};

function showNetworkSetupIfOnline(gameMode) {
  Net.detect().then(function (mode) {
    if (mode && navigator.onLine !== false) showSetup(gameMode, 1);
    else showOfflinePopup();
