/* ─────────────────────────────────────────────────────────────────────────────
 * ui.SetupScene
 * ───────────────────────────────────────────────────────────────────────────── */

var activeSetup = null;
var localPlayer1Board = null;
var touchDevice = window.matchMedia && window.matchMedia("(hover: none)").matches;

function showSetup(gameMode, playerNum) {
  if (activeSetup) activeSetup.shutdown();
  activeSetup = new SetupScene(gameMode, playerNum);
  activeSetup.createScene();
}

function SetupScene(gameMode, playerNum) {
  this.gameMode = gameMode;
  this.playerNum = playerNum || 1;
  this.board = new Board();
  this.gridButtons = [];
  this.shipButtons = {};
  this.orientation = HORIZONTAL;
  this.hoverX = -1;
  this.hoverY = -1;
  this.selectedShip = SHIP_TYPES[0];
  this.localReady = false;
  this.session = null;
  this.armed = null;
}

SetupScene.prototype.titleText = function () {
  switch (this.gameMode) {
    case "SINGLEPLAYER": return "Ship Placement";
    case "HOST": return "Host Game Setup";
    case "JOIN": return "Join Game Setup";
    default: return "Player " + this.playerNum + " Ship Placement";
  }
};

SetupScene.prototype.startingStatusText = function () {
  switch (this.gameMode) {
    case "SINGLEPLAYER": return "Select a ship, place it on the grid, and press Start Game. Ships cannot touch each other, not even diagonally.";
    case "HOST": return "Starting server. Share your code with another player.";
    case "JOIN": return "Enter the host's code, connect, then place your ships.";
    default: return "Player " + this.playerNum + ": place all five ships, then press Done. Ships cannot touch each other, not even diagonally.";
  }
};

SetupScene.prototype.createScene = function () {
  var self = this;

  var title = el("div", null, this.titleText());
  title.style.font = "bold 30px var(--font-serif)";
  title.style.color = "var(--parchment)";

  this.statusLabel = el("div", null, this.startingStatusText());
  this.statusLabel.style.color = "var(--parchment)";
  this.statusLabel.style.maxWidth = "900px";

  var topBox = vbox(6, [title, this.buildModeHeader(), this.statusLabel]);
  topBox.style.padding = "0 0 10px";
  topBox.style.width = "100%";

  var placementGrid = createBoardGrid(3);
  for (var y = 0; y < SIZE; y++) {
    this.gridButtons.push([]);
    for (var x = 0; x < SIZE; x++) {
      var button = createGridButton();
      this.wireTile(button, x, y);
      this.gridButtons[y].push(button);
      placementGrid.appendChild(button);
    }
  }

  var placementSection = createBoardSection("Placement Grid", placementGrid, createLegend([
    { style: TILE_STYLES.SHIP, description: "Placed ship tile" },
    { style: TILE_STYLES.WATER, description: "Open water" }
  ]));

  var centerBox = hbox(28, [placementSection, this.buildSidePanel()]);
  centerBox.classList.add("stack-on-phone");
  centerBox.style.alignItems = "flex-start";
  centerBox.style.justifyContent = "center";
  centerBox.style.flexWrap = "wrap";

  var layout = vbox(0, [topBox, centerBox]);
  layout.style.maxWidth = "1000px";
  layout.style.width = "100%";
  layout.style.padding = "10px";

  var scroller = el("div", "page-scroll");
  scroller.appendChild(layout);

  setScene(scroller, function (event) {
    if (event.key === "r" || event.key === "R") self.rotateShip();
  });

  this.updateBoardButtons();
  this.updateShipButtons();
  this.startNetworkIfNeeded();
};

SetupScene.prototype.wireTile = function (button, x, y) {
  var self = this;
  if (touchDevice) {
    /* No pointer to hover with, so the first tap shows the preview and the second commits. */
    button.addEventListener("click", function () {
      if (self.armed && self.armed.x === x && self.armed.y === y) {
        self.armed = null;
        self.handlePlacement(x, y);
      } else {
        self.armed = { x: x, y: y };
        self.hoverX = x; self.hoverY = y;
        self.renderPreview();
      }
    });
  } else {
    button.addEventListener("click", function () { self.handlePlacement(x, y); });
    button.addEventListener("pointerenter", function () {
      self.hoverX = x; self.hoverY = y;
      self.renderPreview();
    });
    button.addEventListener("pointerleave", function () {
      if (self.hoverX === x && self.hoverY === y) { self.hoverX = -1; self.hoverY = -1; self.renderPreview(); }
    });
  }
};

SetupScene.prototype.buildModeHeader = function () {
  var self = this;
  if (this.gameMode === "LOCAL") {
    var helper = el("div", null, "Player " + this.playerNum + ": select a ship, place it on the grid. Press Done when finished.");
    helper.style.color = "var(--parchment)";
    return helper;
  }
  if (this.gameMode === "HOST") {
    var helpText = el("div", null, "Share this code with your opponent:");
    helpText.style.color = "var(--parchment)";
    this.codeDisplayLabel = el("div", null, "Generating...");
    this.codeDisplayLabel.style.color = "var(--brass)";
    this.codeDisplayLabel.style.font = "bold 32px var(--font-serif)";
    this.codeDisplayLabel.style.letterSpacing = "3px";
    return vbox(2, [helpText, this.codeDisplayLabel]);
  }
  if (this.gameMode === "JOIN") {
    var joinLabel = el("div", null, "Game Code");
    joinLabel.style.color = "var(--parchment)";
    this.codeField = el("input", "text-field code-field");
    this.codeField.placeholder = "ABCDEF";
    this.codeField.style.width = "130px";
    this.codeField.setAttribute("autocapitalize", "characters");
    this.codeField.setAttribute("autocomplete", "off");
    this.codeField.addEventListener("input", function () {
      var upper = self.codeField.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (upper.length > CODE_LENGTH) upper = upper.slice(0, CODE_LENGTH);
      if (upper !== self.codeField.value) self.codeField.value = upper;
    });
    this.connectButton = createMenuButton("Connect", function () { self.connectWithCode(); });
    this.connectButton.style.width = "160px";
    var joinBox = hbox(12, [joinLabel, this.codeField, this.connectButton]);
    joinBox.style.alignItems = "center";
    joinBox.style.flexWrap = "wrap";
    return joinBox;
  }
  var plain = el("div", null, "Place your fleet. Click a ship, place it on the grid, and press Start Game.");
  plain.style.color = "var(--parchment)";
  return plain;
};

SetupScene.prototype.buildSidePanel = function () {
  var self = this;

  var shipsLabel = el("div", null, "Fleet");
  shipsLabel.style.font = "bold 22px var(--font-serif)";
  shipsLabel.style.color = "var(--parchment)";

  var shipsBox = vbox(6, []);
  SHIP_TYPES.forEach(function (shipType) {
    var button = createMenuButton(shipType.display + " (" + shipType.size + ")", function () { self.selectShip(shipType); });
    button.style.width = "260px";
    button.style.height = "38px";
    button.style.maxWidth = "100%";
    self.shipButtons[shipType.name] = button;
    shipsBox.appendChild(button);
  });

  this.selectedShipLabel = el("div");
  this.selectedShipLabel.style.color = "var(--parchment)";
  this.orientationLabel = el("div");
  this.orientationLabel.style.color = "var(--parchment)";
  this.updateSelectedShipLabel();
  this.updateOrientationLabel();

  var rotateButton = createMenuButton(touchDevice ? "Rotate" : "Rotate (R)", function () { self.rotateShip(); });
  var randomButton = createMenuButton("Randomize", function () { self.randomizeBoard(); });
  var clearButton = createMenuButton("Clear Board", function () { self.clearBoard(); });
  this.readyButton = createMenuButton(
    this.gameMode === "SINGLEPLAYER" ? "Start Game" : this.gameMode === "LOCAL" ? "Done" : "Ready",
    function () { self.handleReady(); });
  var backButton = createMenuButton("Back", function () { self.shutdown(); showMainMenu(); });

  var sidePanel = vbox(9, [shipsLabel, shipsBox, this.selectedShipLabel, this.orientationLabel, rotateButton, randomButton, clearButton]);

  if (this.gameMode === "SINGLEPLAYER") {
    var difficultyLabel = el("div", null, "AI Difficulty");
    difficultyLabel.style.font = "bold 18px var(--font-serif)";
    difficultyLabel.style.color = "var(--parchment)";
    this.difficultyDescription = el("div", null, DIFFICULTIES[1].description);
    this.difficultyDescription.style.color = "var(--parchment)";
    this.difficultyDescription.style.maxWidth = "260px";
    this.difficulty = DIFFICULTIES[1];
    this.difficultyBox = comboBox(DIFFICULTIES, "MEDIUM", function (value) {
      self.difficulty = difficultyByName(value);
      self.difficultyDescription.textContent = self.difficulty.description;
    });
    this.difficultyBox.style.width = "260px";
    sidePanel.appendChild(difficultyLabel);
    sidePanel.appendChild(this.difficultyBox);
    sidePanel.appendChild(this.difficultyDescription);
  }

  sidePanel.appendChild(this.readyButton);
  sidePanel.appendChild(backButton);
  sidePanel.style.alignItems = "center";
  sidePanel.style.textAlign = "center";
  sidePanel.classList.add("side-panel");
  return sidePanel;
};

SetupScene.prototype.startNetworkIfNeeded = function () {
  if (this.gameMode !== "HOST") return;
  this.session = new NetworkGameSession(this);
  this.session.host();
  Achievements.gameHosted();
  if (this.codeDisplayLabel) this.codeDisplayLabel.textContent = this.session.code;
};

SetupScene.prototype.connectWithCode = function () {
  var code = this.codeField ? this.codeField.value.trim() : "";
  if (code.length < CODE_LENGTH) {
    this.statusLabel.textContent = "Enter the full " + CODE_LENGTH + "-character code from the host.";
    return;
  }
  if (this.session) this.session.close();
  this.session = new NetworkGameSession(this);
  this.connectButton.disabled = true;
  this.session.joinWithCode(code);
  Achievements.gameJoined();
};

/* Listener callbacks, the same set the desktop scene implements. */
SetupScene.prototype.onWaitingForOpponent = function (message) { this.statusLabel.textContent = message; };
SetupScene.prototype.onConnected = function () {
  this.statusLabel.textContent = "Connected. Place all ships and press Ready.";
  if (this.connectButton) this.connectButton.disabled = true;
};
SetupScene.prototype.onRemoteReady = function () {
  this.statusLabel.textContent = this.localReady
    ? "Opponent is ready. Starting game..."
    : "Opponent is ready. Finish placing ships and press Ready.";
};
SetupScene.prototype.onGameStart = function (myTurn) {
  activeSetup = null;
  Audio.stopMenuMusic();
  startNetworkGame(this.board, this.session, myTurn);
};
SetupScene.prototype.onDisconnected = function (message) {
  this.statusLabel.textContent = message;
  this.localReady = false;
  if (this.readyButton) this.readyButton.disabled = false;
  if (this.connectButton && this.gameMode === "JOIN") this.connectButton.disabled = false;
};
SetupScene.prototype.onError = function (message) {
  if (this.gameMode === "HOST" || this.gameMode === "JOIN") Audio.playInternet();
  this.statusLabel.textContent = message;
  this.localReady = false;
  if (this.connectButton && this.gameMode === "JOIN") this.connectButton.disabled = false;
};

SetupScene.prototype.shutdown = function () { if (this.session) this.session.close(); };

/*
 * Draws the squares the selected ship would occupy from wherever the pointer is, in brass
 * if that placement is legal and in red if it is not, so the touching rule can be seen
 * rather than discovered by being told off after a click.
 */
SetupScene.prototype.renderPreview = function () {
  this.updateBoardButtons();
  if (this.hoverX < 0 || this.localReady || !this.selectedShip || this.board.isShipPlaced(this.selectedShip)) return;
  var legal = this.board.canPlaceShip(this.selectedShip, this.hoverX, this.hoverY, this.orientation);
  var stepX = this.orientation === HORIZONTAL ? 1 : 0;
  var stepY = this.orientation === HORIZONTAL ? 0 : 1;
  for (var i = 0; i < this.selectedShip.size; i++) {
    var x = this.hoverX + i * stepX;
    var y = this.hoverY + i * stepY;
    if (this.board.isInBounds(x, y)) markPreviewTile(this.gridButtons[y][x], legal);
  }
};

SetupScene.prototype.handlePlacement = function (x, y) {
  if (this.localReady) { this.statusLabel.textContent = "You are already ready. Waiting for the other player."; return; }
  if (this.board.isShipPlaced(this.selectedShip)) { this.statusLabel.textContent = "That ship is already placed. Select another ship."; return; }
  if (this.board.placeShip(this.selectedShip, x, y, this.orientation)) {
    Audio.playSelect();
    this.statusLabel.textContent = this.selectedShip.display + " placed.";
    this.updateBoardButtons();
    this.updateShipButtons();
    this.selectNextAvailableShip();
  } else {
    this.statusLabel.textContent = "Invalid placement. Ships must stay on the grid and cannot touch each other, not even at a corner.";
  }
};

SetupScene.prototype.selectShip = function (shipType) {
  this.selectedShip = shipType;
  this.armed = null;
  this.updateShipButtons();
  this.updateSelectedShipLabel();
  this.statusLabel.textContent = "Selected " + shipType.display + ".";
  this.renderPreview();
};

SetupScene.prototype.rotateShip = function () {
  this.orientation = this.orientation === HORIZONTAL ? VERTICAL : HORIZONTAL;
  this.updateOrientationLabel();
  this.renderPreview();
  this.statusLabel.textContent = "Orientation set to " + this.orientation.toLowerCase() + ".";
};

SetupScene.prototype.randomizeBoard = function () {
  if (this.localReady) return;
  this.board.randomize();
  Achievements.boardRandomized();
  this.armed = null;
  this.updateBoardButtons();
  this.updateShipButtons();
  this.selectNextAvailableShip();
  this.statusLabel.textContent = "Board randomized.";
};

SetupScene.prototype.clearBoard = function () {
  if (this.localReady) return;
  this.board.clear();
  Achievements.boardCleared();
  this.selectedShip = SHIP_TYPES[0];
  this.armed = null;
  this.updateBoardButtons();
  this.updateShipButtons();
  this.updateSelectedShipLabel();
  this.updateOrientationLabel();
  this.statusLabel.textContent = "Board cleared.";
};

SetupScene.prototype.handleReady = function () {
  if (!this.board.allShipsPlaced()) { this.statusLabel.textContent = "Place all five ships before continuing."; return; }

  if (this.gameMode === "SINGLEPLAYER") { activeSetup = null; startSinglePlayerGame(this.board, this.difficulty); return; }
  if (this.gameMode === "LOCAL") { activeSetup = null; onLocalPlayerReady(this.playerNum, this.board); return; }

  if (!this.session || !this.session.isConnected()) {
    this.statusLabel.textContent = this.gameMode === "HOST" ? "Waiting for a player to connect." : "Connect to a host before pressing Ready.";
    return;
  }
  if (this.localReady) { this.statusLabel.textContent = "You are already ready. Waiting for the opponent."; return; }

  this.localReady = true;
  this.readyButton.disabled = true;
  this.statusLabel.textContent = "Ready sent. Waiting for the opponent.";
  this.session.sendReady();
};

SetupScene.prototype.updateSelectedShipLabel = function () {
  if (this.selectedShipLabel) {
    this.selectedShipLabel.textContent = "Selected ship: " + this.selectedShip.display + " (" + this.selectedShip.size + " tiles)";
  }
};

SetupScene.prototype.updateOrientationLabel = function () {
  if (this.orientationLabel) {
    this.orientationLabel.textContent = "Orientation: " + this.orientation.charAt(0) + this.orientation.slice(1).toLowerCase();
  }
};

SetupScene.prototype.updateBoardButtons = function () {
  for (var y = 0; y < SIZE; y++) {
    for (var x = 0; x < SIZE; x++) {
      var tile = this.board.getTile(x, y);
      if (tile.ship) styleGridButton(this.gridButtons[y][x], TILE_STYLES.SHIP, tile.ship.type.name.charAt(0));
      else styleGridButton(this.gridButtons[y][x], TILE_STYLES.WATER, "");
    }
  }
};

SetupScene.prototype.updateShipButtons = function () {
  var self = this;
  SHIP_TYPES.forEach(function (shipType) {
    var button = self.shipButtons[shipType.name];
    if (!button) return;
    var placed = self.board.isShipPlaced(shipType);
    button.disabled = placed;
    button.classList.remove("ready-button", "pending-button");
    if (placed) button.classList.add("ready-button");
    else if (shipType === self.selectedShip) button.classList.add("pending-button");
  });
};

SetupScene.prototype.selectNextAvailableShip = function () {
  for (var i = 0; i < SHIP_TYPES.length; i++) {
    if (!this.board.isShipPlaced(SHIP_TYPES[i])) {
      this.selectedShip = SHIP_TYPES[i];
      break;
    }
  }
  this.updateSelectedShipLabel();
  this.updateShipButtons();
};

}

function GameScene(playerBoard) {

  this.isLocalMultiplayer = false;
  this.currentPlayer = 1;
  this.p1EnemyAttacked = emptyFlags();
  this.p1EnemyHits = emptyFlags();
  this.p2EnemyAttacked = emptyFlags();
  this.p2EnemyHits = emptyFlags();

  this.myTurn = false;
  this.gameFinished = false;
  this.shotAnimationActive = false;
  this.selectedTargetX = -1;
  this.selectedTargetY = -1;
  this.pendingAttackX = -1;
  this.pendingAttackY = -1;

  this.enemyBoard = null;
  this.ai = null;
  this.difficulty = null;
  this.playerShots = 0;
  this.playerHits = 0;
  this.battleLog = [];

  this.hitBottomRight = false;
  this.hitDeadCentre = false;
  this.ballisticEverEarned = false;
  this.ballisticUsed = false;
  this.ballisticMissed = false;
  this.ballisticSankCarrier = false;

function startSinglePlayerGame(board, difficulty) {

  scene.difficulty = difficulty;
  scene.myTurn = true;
  scene.createScene();
}

function startNetworkGame(board, session, myTurn) {
  var scene = new GameScene(board);
  scene.session = session;
  scene.myTurn = myTurn;
  session.listener = scene;

}

function startLocalGame(board1, board2) {

  scene.player2Board = board2;

  scene.enemyAttacked = scene.p1EnemyAttacked;

GameScene.prototype.buildPlayerGrid = function () {
  var grid = createBoardGrid(2);
  for (var y = 0; y < SIZE; y++) {
    this.playerButtons.push([]);
    for (var x = 0; x < SIZE; x++) {
      var button = createGridButton();
      button.disabled = true;
      this.playerButtons[y].push(button);
      grid.appendChild(button);
    }
  }
  return grid;
};

GameScene.prototype.buildEnemyGrid = function () {
  var self = this;
  var grid = createBoardGrid(2);
  for (var y = 0; y < SIZE; y++) {
    this.enemyButtons.push([]);
    for (var x = 0; x < SIZE; x++) {
      var button = createGridButton();
      (function (fx, fy) {
        button.addEventListener("click", function () { self.fireAtEnemy(fx, fy); });
      })(x, y);
      this.enemyButtons[y].push(button);
      grid.appendChild(button);
    }
  }
  return grid;
};

GameScene.prototype.fireAtEnemy = function (x, y) {
  var self = this;
  if (this.gameFinished) return;
  if (!this.myTurn) { this.statusLabel.textContent = "Wait for your turn."; return; }
  if (this.enemyAttacked[y][x]) { this.statusLabel.textContent = "That tile was already attacked."; return; }

  this.selectedTargetX = x;
  this.selectedTargetY = y;
  this.targetLabel.textContent = "Firing at " + toGridRef(x, y) + "...";
  this.myTurn = false;
  this.shotAnimationActive = true;
  this.updateEnemyInteractivity();

  if (this.session) {
    this.pendingAttackX = x;
    this.pendingAttackY = y;
    this.statusLabel.textContent = "Firing at " + toGridRef(x, y) + "...";
    this.animateShot(this.enemyButtons[y][x], function () {
      self.shotAnimationActive = false;
      self.statusLabel.textContent = "Shot fired. Waiting for result...";
      self.session.sendAttack(x, y);
      self.updateEnemyInteractivity();
    });
    return;
  }

  if (this.isLocalMultiplayer) { this.shipsVisible = false; this.refreshPlayerGrid(); }
  this.statusLabel.textContent = "Firing at " + toGridRef(x, y) + "...";

  this.animateShot(this.enemyButtons[y][x], function () {
    self.shotAnimationActive = false;
    var outcome = self.enemyBoard.receiveAttack(x, y);
    self.enemyAttacked[y][x] = true;
    self.enemyHits[y][x] = outcome.result === HIT;

    var usedBallistic = self.ballisticMissileActive;
    if (self.ballisticMissileActive) {
      self.ballisticMissileActive = false;
      self.ballisticButton.hidden = true;
      self.ballisticLabel.hidden = true;
      if (outcome.result === HIT) outcome = self.sinkShipWithBallistic(x, y, outcome);
    }

    self.playerShots++;
    if (outcome.result === HIT) self.playerHits++;
    self.recordMyShot(x, y, outcome, usedBallistic);
    self.log(self.isLocalMultiplayer ? "Player " + self.currentPlayer : "You", x, y, outcome);

    self.markEnemyClearedWater(outcome);
    self.clearSelectedTarget();
    self.refreshEnemyGrid();

    if (outcome.result === HIT) {
      self.statusLabel.textContent = outcome.sunkShip
        ? (usedBallistic ? "BALLISTIC STRIKE! You sunk the enemy " + outcome.shipType.name.toLowerCase() + "!"
                         : "You sunk the enemy " + outcome.shipType.name.toLowerCase() + "!")
        : "Hit at " + toGridRef(x, y) + "!";
      Audio.playExplosion();
    } else {
      self.statusLabel.textContent = usedBallistic ? "Ballistic missile missed. Perk lost." : "Miss at " + toGridRef(x, y) + ".";
    }

    var trackPlayer = self.isLocalMultiplayer ? self.currentPlayer : 1;
    self.updateBallisticStreak(trackPlayer, outcome.sunkShip, outcome.result !== HIT);

    if (outcome.gameOver) {
      if (self.isLocalMultiplayer) self.finishGame("Victory", "Player " + self.currentPlayer + " wins! All enemy ships were sunk.");
      else self.finishGame("Victory", "You destroyed the AI fleet.");
      return;
    }

    self.updateSummaries();
    self.updateEnemyInteractivity();

    if (self.isLocalMultiplayer) {
      window.setTimeout(function () { self.showHandoffOverlay(); }, 500);
      return;
    }
    window.setTimeout(function () { self.executeAiTurn(); }, 700);
  });
};

GameScene.prototype.executeAiTurn = function () {
  var self = this;
  if (this.gameFinished) return;
  var shot = this.ai.nextShot();
  this.shotAnimationActive = true;
  this.clearSelectedTarget();
  this.statusLabel.textContent = "AI is firing at " + toGridRef(shot.x, shot.y) + "...";
  this.animateShot(this.playerButtons[shot.y][shot.x], function () {
    self.shotAnimationActive = false;
    var outcome = self.playerBoard.receiveAttack(shot.x, shot.y);
    var hit = outcome.result === HIT;
    self.ai.handleShotResult(shot, outcome);
    self.log("The AI", shot.x, shot.y, outcome);
    self.refreshPlayerGrid();
    self.updateSummaries();
    if (hit) Audio.playExplosion();
    if (outcome.gameOver) { self.finishGame("Defeat", "The AI destroyed your fleet."); return; }
    self.myTurn = true;
    self.statusLabel.textContent = outcome.sunkShip
      ? "AI sunk your " + outcome.shipType.name.toLowerCase() + ". Your turn."
      : "AI fired at " + toGridRef(shot.x, shot.y) + ". Your turn.";
    self.updateEnemyInteractivity();
  });
};

/* Network listener callbacks */
GameScene.prototype.onTurnGranted = function () {
  if (this.gameFinished) return;
  this.myTurn = true;
  this.statusLabel.textContent = "Your turn.";
  this.clearSelectedTarget();
  this.updateEnemyInteractivity();
};
GameScene.prototype.onAttackReceived = function (x, y) {
  var self = this;
  if (this.gameFinished) return;
  /* Nothing stops a peer sending coordinates off the grid, so check before indexing. */
  if (!this.playerBoard.isInBounds(x, y)) { this.finishGame("Connection Closed", "An illegal network move was detected."); return; }
  this.animateShot(this.playerButtons[y][x], function () {
    var outcome = self.playerBoard.receiveAttack(x, y);
    self.log("Your opponent", x, y, outcome);
    if (outcome.result === ALREADY_ATTACKED || outcome.result === INVALID) {
      self.finishGame("Connection Closed", "An illegal network move was detected.");
      return;
    }
    self.refreshPlayerGrid();
    self.updateSummaries();
    self.session.sendResult(outcome.result === HIT);
    if (outcome.result === HIT) Audio.playExplosion();
    if (outcome.gameOver) {
      self.session.sendLose();
      self.finishGame("Defeat", "All of your ships were sunk.");
    } else {
      self.statusLabel.textContent = "Opponent fired at " + toGridRef(x, y) + ".";
    }
  });
};
GameScene.prototype.onAttackResult = function (hit) {
  if (this.gameFinished || this.pendingAttackX < 0 || this.pendingAttackY < 0) return;
  this.enemyAttacked[this.pendingAttackY][this.pendingAttackX] = true;
  this.enemyHits[this.pendingAttackY][this.pendingAttackX] = hit;
  this.playerShots++;
  if (hit) this.playerHits++;
  this.recordMyNetworkShot(this.pendingAttackX, this.pendingAttackY, hit);
  this.refreshEnemyGrid();
  if (hit) {
    this.statusLabel.textContent = "Hit confirmed at " + toGridRef(this.pendingAttackX, this.pendingAttackY) + ".";
    Audio.playExplosion();
  } else {
    this.statusLabel.textContent = "Miss at " + toGridRef(this.pendingAttackX, this.pendingAttackY) + ".";
  }
  this.pendingAttackX = -1;
  this.pendingAttackY = -1;
  this.clearSelectedTarget();
  this.updateSummaries();
  this.updateEnemyInteractivity();
  this.session.sendTurn();
};
GameScene.prototype.onWin = function () {
  if (this.gameFinished) return;
  this.session.sendWin();
  this.finishGame("Victory", "You sank the enemy fleet.");
};
GameScene.prototype.onLose = function () {
  if (this.gameFinished) return;
  this.finishGame("Defeat", "All of your ships were sunk.");
};
GameScene.prototype.onDisconnected = function (message) {
  if (this.gameFinished) return;
  this.finishGame("Connection Closed", message);
};
GameScene.prototype.onConnected = function () {};
GameScene.prototype.onRemoteReady = function () {};
GameScene.prototype.onGameStart = function () {};
GameScene.prototype.onWaitingForOpponent = function () {};
GameScene.prototype.onError = function (message) { this.statusLabel.textContent = message; };

GameScene.prototype.refreshPlayerGrid = function () {
  for (var y = 0; y < SIZE; y++) {
    for (var x = 0; x < SIZE; x++) {
      var tile = this.playerBoard.getTile(x, y);
      var button = this.playerButtons[y][x];
      if (tile.attacked) {
        if (tile.ship) styleGridButton(button, TILE_STYLES.HIT, "X");
        else styleGridButton(button, TILE_STYLES.MISS, "o");
      } else if (tile.ship && this.shipsVisible) {
        styleGridButton(button, TILE_STYLES.SHIP, "S");
      } else {
        styleGridButton(button, TILE_STYLES.WATER, "");
      }
    }
  }
};

GameScene.prototype.refreshEnemyGrid = function () {
  for (var y = 0; y < SIZE; y++) {
    for (var x = 0; x < SIZE; x++) {
      var button = this.enemyButtons[y][x];
      if (!this.enemyAttacked[y][x]) {
        styleGridButton(button, TILE_STYLES.WATER, "");
        if (x === this.selectedTargetX && y === this.selectedTargetY) styleSelectedTargetButton(button);
      } else if (this.enemyHits[y][x]) {
        styleGridButton(button, TILE_STYLES.HIT, "X");
      } else {
        styleGridButton(button, TILE_STYLES.MISS, "o");
      }
    }
  }
};

GameScene.prototype.showHandoffOverlay = function () {
  var self = this;
  var nextPlayer = this.currentPlayer === 1 ? 2 : 1;

  var heading = el("div", null, "Player " + nextPlayer + "'s Turn");
  heading.style.font = "bold 44px var(--font-serif)";
  heading.style.color = "#f4fbff";

  var sub = el("div", null, "Pass the computer to Player " + nextPlayer + ", then press Continue.");
  sub.style.font = "20px var(--font-serif)";
  sub.style.color = "#d7e9ff";

  var continueButton = el("button", "primary-button", "Continue");
  continueButton.style.width = "220px";
  continueButton.style.height = "52px";

  var overlay = el("div", "turn-overlay");
  continueButton.addEventListener("click", function () {
    Audio.playSelect();
    overlay.remove();
    self.swapLocalPlayer();
  });

  var box = vbox(24, [heading, sub, continueButton]);
  box.style.alignItems = "center";
  box.style.textAlign = "center";
  box.style.maxWidth = "600px";
  overlay.appendChild(box);
  document.body.appendChild(overlay);
};

GameScene.prototype.swapLocalPlayer = function () {
  var self = this;
  this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
  this.playerBoard = this.currentPlayer === 1 ? this.player1Board : this.player2Board;
  this.enemyBoard = this.currentPlayer === 1 ? this.player2Board : this.player1Board;
  this.enemyAttacked = this.currentPlayer === 1 ? this.p1EnemyAttacked : this.p2EnemyAttacked;
  this.enemyHits = this.currentPlayer === 1 ? this.p1EnemyHits : this.p2EnemyHits;
  this.myTurn = true;
  this.selectedTargetX = -1;
  this.selectedTargetY = -1;
  this.pendingAttackX = -1;
  this.pendingAttackY = -1;
  this.shipsVisible = false;
  this.ballisticLabel.hidden = true;
  this.ballisticButton.hidden = true;
  this.refreshPlayerGrid();
  this.refreshEnemyGrid();
  this.updateSummaries();
  this.updateEnemyInteractivity();
  this.statusLabel.textContent = "Player " + this.currentPlayer + "'s turn. Ships revealed in 3...";
  window.setTimeout(function () {
    self.shipsVisible = true;
    self.refreshPlayerGrid();
    var earned = self.ballisticEarned[self.currentPlayer];
    self.ballisticLabel.hidden = !earned;
    self.ballisticButton.hidden = !earned;
    self.ballisticButton.disabled = self.ballisticMissileActive;
    self.ballisticButton.textContent = self.ballisticMissileActive ? "BALLISTIC MISSILE ARMED" : "USE BALLISTIC MISSILE";
    self.statusLabel.textContent = "Player " + self.currentPlayer + "'s turn.";
  }, 3000);
};

GameScene.prototype.finishGame = function (title, message) {
  this.gameFinished = true;
  battleShowing = false;
  var won = title === "Victory";
  if (this.difficulty && !this.isLocalMultiplayer && !this.session) {
    Statistics.recordGame(this.difficulty, won, this.playerShots, this.playerHits);
  }
  // Every mode is judged, but on different things. See the Achievements comment.
  Achievements.evaluate(this.buildGameRecord(won));
  this.clearSelectedTarget();
  this.updateEnemyInteractivity();
  if (this.session) this.session.close();
  showEndScene(title, message);
};

/*
 * The log as an overlay rather than a panel beside the boards, because the board layout
 * already fills the smallest window the game allows and has nothing left to give.
 */
GameScene.prototype.showBattleLog = function () {
  Achievements.battleLogOpened();
  var entries = vbox(4, []);
  if (this.battleLog.length === 0) {
    entries.appendChild(el("div", "muted-text", "Nothing has happened yet."));
  } else {
    this.battleLog.forEach(function (entry) { entries.appendChild(el("div", "body-text", entry)); });
  }

  var scroller = el("div", "terms-scroll");
  scroller.style.maxHeight = "360px";
  scroller.style.width = "100%";
  scroller.appendChild(entries);

  var overlay = el("div", "turn-overlay");
  var panel = vbox(14, [createSectionTitle("Battle Log"), scroller]);
  panel.classList.add("panel");
  panel.style.padding = "20px 24px 22px";
  panel.style.maxWidth = "560px";
  panel.style.width = "100%";
  panel.style.alignItems = "stretch";

  var close = createMenuButton("Close", function () { overlay.remove(); });
  close.style.alignSelf = "center";
  panel.appendChild(close);

  overlay.appendChild(panel);
  overlay.addEventListener("click", function (event) { if (event.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  /* Open at the newest entry, which is the one you just caused. */
  scroller.scrollTop = scroller.scrollHeight;
};

GameScene.prototype.log = function (who, x, y, outcome) {
  var what;
  if (outcome.result !== HIT) what = "missed";
  else if (outcome.sunkShip && outcome.shipType) what = "hit and sank the " + outcome.shipType.display.toLowerCase();
  else what = "hit";
  this.battleLog.push((this.battleLog.length + 1) + ".  " + who + " " + what + " at " + toGridRef(x, y));
};

GameScene.prototype.countSunkPlayerShips = function () {
  return this.playerBoard.ships.filter(isSunk).length;
};

function toGridRef(x, y) { return String.fromCharCode(65 + x) + (y + 1); }

GameScene.prototype.createSummaryLabel = function () {
  var label = el("div");
  label.style.font = "15px var(--font-serif)";
  label.style.color = "var(--parchment)";
  return label;
};

GameScene.prototype.updateSummaries = function () {
  var remaining = this.playerBoard.ships.filter(function (ship) { return !isSunk(ship); }).length;
  this.playerSummaryLabel.textContent = "Ships remaining: " + remaining + "/5";

  if (this.enemyBoard) {
    var enemyRemaining = this.enemyBoard.ships.filter(function (ship) { return !isSunk(ship); }).length;
    this.enemySummaryLabel.textContent = "Enemy ships remaining: " + enemyRemaining + "/5";
  } else {
    var shots = 0;
    for (var y = 0; y < SIZE; y++) for (var x = 0; x < SIZE; x++) if (this.enemyAttacked[y][x]) shots++;
    this.enemySummaryLabel.textContent = "Shots fired: " + shots;
  }
};

GameScene.prototype.updateEnemyInteractivity = function () {
  var canFire = !this.gameFinished && !this.shotAnimationActive && this.myTurn && this.pendingAttackX < 0 && this.pendingAttackY < 0;
  for (var y = 0; y < SIZE; y++) {
    for (var x = 0; x < SIZE; x++) this.enemyButtons[y][x].disabled = !canFire || this.enemyAttacked[y][x];
  }
  if (this.passTurnButton) this.passTurnButton.disabled = !canFire;
  if (this.targetLabel && this.selectedTargetX < 0 && !this.shotAnimationActive) {
    this.targetLabel.textContent = canFire ? "Click an enemy square to fire." : "Waiting for turn...";
  }
};

GameScene.prototype.passTurn = function () {
  var self = this;
  if (this.gameFinished || !this.myTurn || this.shotAnimationActive || this.pendingAttackX >= 0) return;
  this.turnsPassed++;
  Achievements.turnPassed();
  this.myTurn = false;
  this.updateEnemyInteractivity();

  if (this.session) {
    this.statusLabel.textContent = "Turn passed.";
    this.session.sendTurn();
    return;
  }
  if (this.isLocalMultiplayer) {
    this.statusLabel.textContent = "Player " + this.currentPlayer + " passed their turn.";
    window.setTimeout(function () { self.showHandoffOverlay(); }, 500);
    return;
  }
  this.statusLabel.textContent = "You passed your turn. AI is thinking...";
  window.setTimeout(function () { self.executeAiTurn(); }, 700);
};

GameScene.prototype.animateShot = function (targetButton, onImpact) {
  Audio.playFire();
  var bounds = targetButton.getBoundingClientRect();
  var centreX = bounds.left + bounds.width / 2;
  var centreY = bounds.top + bounds.height / 2;

  var bomb = el("div");
  bomb.style.position = "absolute";
  bomb.style.left = (centreX - 14) + "px";
  bomb.style.top = (centreY - 14) + "px";
  bomb.style.width = "28px";
  bomb.style.height = "28px";
  bomb.appendChild(bombGraphic(28));
  effectsLayer.appendChild(bomb);

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduced && bomb.animate) {
    bomb.animate(
      [{ transform: "translateY(-140px)" }, { transform: "translateY(0)" }],
      { duration: 950, easing: "cubic-bezier(0.45, 0, 0.75, 1)" }
    );
  }
  window.setTimeout(function () { bomb.remove(); }, 950);
  window.setTimeout(function () { Audio.stopFire(); onImpact(); }, 1000);
};

GameScene.prototype.clearSelectedTarget = function () {
  this.selectedTargetX = -1;
  this.selectedTargetY = -1;
  if (this.targetLabel) this.targetLabel.textContent = "Click an enemy square to fire.";
  this.refreshEnemyGrid();
};

GameScene.prototype.markEnemyClearedWater = function (outcome) {
  var self = this;
  outcome.cleared.forEach(function (coordinate) {
    self.enemyAttacked[coordinate.y][coordinate.x] = true;
    self.enemyHits[coordinate.y][coordinate.x] = false;
  });
};

GameScene.prototype.sinkShipWithBallistic = function (hitX, hitY, initialOutcome) {
  var ship = this.enemyBoard.getTile(hitX, hitY).ship;
  var last = initialOutcome;
  for (var i = 0; i < ship.coordinates.length; i++) {
    var coord = ship.coordinates[i];
    if (coord.x === hitX && coord.y === hitY) continue;
    last = this.enemyBoard.receiveAttack(coord.x, coord.y);
    this.enemyAttacked[coord.y][coord.x] = true;
    this.enemyHits[coord.y][coord.x] = true;
  }
  return last;
};

GameScene.prototype.updateBallisticStreak = function (playerIndex, wasSink, wasMiss) {
  if (this.ballisticEarned[playerIndex]) return;
  if (wasMiss) {
    this.consecutiveSinks[playerIndex] = 0;
  } else if (wasSink) {
    this.consecutiveSinks[playerIndex]++;
    if (this.consecutiveSinks[playerIndex] >= 2) {
      this.ballisticEarned[playerIndex] = true;
      this.ballisticEverEarned = true;
      this.ballisticLabel.hidden = false;
      this.ballisticButton.hidden = false;
      Audio.playBallistic();
    }
  }
};

/* ─────────────────────────────────────────────────────────────────────────────
 * The record kept for achievements.
 *
 * Only the things that cannot be read off the board afterwards are tracked as they happen.
 * Anything still visible at the end — which of your ships were hit, which are damaged, how
 * your fleet was laid out — is counted from the board itself, so it cannot drift.
 * ───────────────────────────────────────────────────────────────────────────── */

GameScene.prototype.recordMyShot = function (x, y, outcome, usedBallistic) {
  this.firedByMe[y][x] = true;
  var hit = outcome.result === HIT;
  this.noteShot(x, y, hit);

  if (outcome.sunkShip) {
    this.sinkOrder.push(outcome.shipType);
    this.sinkRun++;
    this.mostConsecutiveSinks = Math.max(this.mostConsecutiveSinks, this.sinkRun);
  } else {
    this.sinkRun = 0;
  }

  if (usedBallistic) {
    this.ballisticUsed = true;
    if (hit) {
      if (outcome.sunkShip && outcome.shipType && outcome.shipType.name === "CARRIER") this.ballisticSankCarrier = true;
    } else {
      this.ballisticMissed = true;
    }
    if (outcome.gameOver) this.wonWithBallistic = true;
  }
};

/* The same, for a network game, where all a peer is told is hit or miss. */
GameScene.prototype.recordMyNetworkShot = function (x, y, hit) {
  this.firedByMe[y][x] = true;
  this.noteShot(x, y, hit);
};

GameScene.prototype.noteShot = function (x, y, hit) {
  if (this.playerShots === 1) this.firstShotHit = hit;
  if (this.playerShots <= 3) this.firstThreeHits = hit && (this.playerShots === 1 || this.firstThreeHits);

  if (hit) {
    this.hitStreak++;
    this.missStreak = 0;
    this.longestHitStreak = Math.max(this.longestHitStreak, this.hitStreak);
    if (x === 0 && y === 0) this.hitTopLeft = true;
    if (x === SIZE - 1 && y === SIZE - 1) this.hitBottomRight = true;
    var low = SIZE / 2 - 1;
    if ((x === low || x === low + 1) && (y === low || y === low + 1)) this.hitDeadCentre = true;
  } else {
    this.missStreak++;
    this.hitStreak = 0;
    this.longestMissStreak = Math.max(this.longestMissStreak, this.missStreak);
  }
};

/* True once you have fired at all ten squares of any one row or any one column. */
GameScene.prototype.sweptALine = function () {
  for (var i = 0; i < SIZE; i++) {
    var wholeRow = true, wholeColumn = true;
    for (var j = 0; j < SIZE; j++) {
      if (!this.firedByMe[i][j]) wholeRow = false;
      if (!this.firedByMe[j][i]) wholeColumn = false;
    }
    if (wholeRow || wholeColumn) return true;
  }
  return false;
};

/* Reads the shape of your own fleet off the board you played with. */
function describeFleet(record, board) {
  if (board.ships.length !== SHIP_TYPES.length) return;
  record.randomizedBoard = !!board.randomized;

  record.everyShipOnEdge = true;
  record.noShipOnEdge = true;
  record.allHorizontal = true;
  record.allVertical = true;

  var quarterUsed = [false, false, false, false];
  var topHalf = true, bottomHalf = true, leftHalf = true, rightHalf = true;

  board.ships.forEach(function (ship) {
    var touchesEdge = false;
    var firstX = ship.coordinates[0].x;
    var firstY = ship.coordinates[0].y;
    ship.coordinates.forEach(function (c) {
      if (c.x === 0 || c.y === 0 || c.x === SIZE - 1 || c.y === SIZE - 1) {
        touchesEdge = true;
        record.noShipOnEdge = false;
      }
      if (c.x !== firstX) record.allVertical = false;
      if (c.y !== firstY) record.allHorizontal = false;
      quarterUsed[(c.y < SIZE / 2 ? 0 : 2) + (c.x < SIZE / 2 ? 0 : 1)] = true;
      if (c.y >= SIZE / 2) topHalf = false;
      if (c.y < SIZE / 2) bottomHalf = false;
      if (c.x >= SIZE / 2) leftHalf = false;
      if (c.x < SIZE / 2) rightHalf = false;
    });
    if (!touchesEdge) record.everyShipOnEdge = false;
  });

  record.withinOneHalf = topHalf || bottomHalf || leftHalf || rightHalf;
  record.shipInEveryQuarter = quarterUsed[0] && quarterUsed[1] && quarterUsed[2] && quarterUsed[3];

  var last = SIZE - 1;
  record.shipInEveryCorner = !!board.getTile(0, 0).ship && !!board.getTile(last, 0).ship
    && !!board.getTile(0, last).ship && !!board.getTile(last, last).ship;
}

GameScene.prototype.buildGameRecord = function (won) {
  var self = this;
  var record = {
    mode: this.isLocalMultiplayer ? "LOCAL" : this.session ? "NETWORK" : "SINGLEPLAYER",
    difficulty: this.difficulty,
    won: won,
    shots: this.playerShots,
    hits: this.playerHits,
    shipsLost: this.countSunkPlayerShips(),
    shipsRemaining: 0,
    lastShipDamaged: false,
    enemyHitsTaken: 0,
    carrierEverHit: false,
    destroyerEverHit: false,
    firstShotHit: this.firstShotHit,
    firstThreeHits: this.firstThreeHits && this.playerShots >= 3,
    longestHitStreak: this.longestHitStreak,
    longestMissStreak: this.longestMissStreak,
    mostConsecutiveSinks: this.mostConsecutiveSinks,
    sinkOrder: this.sinkOrder.slice(),
    hitTopLeft: this.hitTopLeft,
    hitBottomRight: this.hitBottomRight,
    hitDeadCentre: this.hitDeadCentre,
    firedEveryCorner: this.firedByMe[0][0] && this.firedByMe[0][SIZE - 1]
      && this.firedByMe[SIZE - 1][0] && this.firedByMe[SIZE - 1][SIZE - 1],
    sweptALine: this.sweptALine(),
    ballisticEarned: this.ballisticEverEarned,
    ballisticUsed: this.ballisticUsed,
    ballisticMissed: this.ballisticMissed,
    ballisticSankCarrier: this.ballisticSankCarrier,
    wonWithBallistic: this.wonWithBallistic,
    everyShipOnEdge: false,
    noShipOnEdge: false,
    allHorizontal: false,
    allVertical: false,
    withinOneHalf: false,
    shipInEveryQuarter: false,
    shipInEveryCorner: false,
    randomizedBoard: false,
    turnsPassed: this.turnsPassed,
    durationMillis: Date.now() - this.gameStartMillis,
    finishedHour: new Date().getHours()
  };
  record.shipsRemaining = this.playerBoard.ships.length - record.shipsLost;

  /* Counted from the board rather than tallied during play. */
  this.playerBoard.ships.forEach(function (ship) {
    var damaged = false;
    ship.coordinates.forEach(function (c) {
      if (self.playerBoard.getTile(c.x, c.y).attacked) {
        damaged = true;
        record.enemyHitsTaken++;
      }
    });
    if (damaged) {
      if (ship.type.name === "CARRIER") record.carrierEverHit = true;
      if (ship.type.name === "DESTROYER") record.destroyerEverHit = true;
      if (!isSunk(ship)) record.lastShipDamaged = true;
    }
  });

  describeFleet(record, this.playerBoard);
  return record;
};

/* ─────────────────────────────────────────────────────────────────────────────
 * ui.PartyMode — the disco.
 *
 * Lays a layer of coloured lights over whatever screen is showing, sweeps them
 * around in time with the track, and when the music runs out fades the whole
 * thing away and takes itself back off the page so the game is exactly as it was.
 * The overlay never accepts the pointer, so a game underneath stays playable.
 * ───────────────────────────────────────────────────────────────────────────── */

var LIGHT_COLOURS = ["#ff2d95", "#00e5ff", "#ffd200", "#7cff4f", "#b14bff", "#ff6a00"];

var PartyMode = {
  running: false, overlay: null, animations: [],

  start: function () {
    if (this.running) return;
    this.running = true;

    var overlay = el("div", "party-layer");
    this.animations = [];
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    for (var i = 0; i < LIGHT_COLOURS.length; i++) {
      var radius = 150 + Math.floor(Math.random() * 90);
      var light = el("div", "party-light");
      light.style.width = (radius * 2) + "px";
      light.style.height = (radius * 2) + "px";
      light.style.background = LIGHT_COLOURS[i];
      light.style.opacity = "0.34";
      light.style.left = "calc(50% - " + radius + "px)";
      light.style.top = "calc(50% - " + radius + "px)";
      overlay.appendChild(light);

      if (!reduced && light.animate) {
        /* Each light runs its own loop, so they drift apart instead of moving as one block. */
        var frames = [];
        for (var step = 0; step <= 8; step++) {
          frames.push({
            transform: "translate(" + ((Math.random() - 0.5) * 900) + "px, " + ((Math.random() - 0.5) * 560) + "px) " +
                       "scale(" + (0.7 + Math.random() * 0.8) + ")",
            opacity: 0.18 + Math.random() * 0.30
          });
        }
        frames.push(frames[0]);
        this.animations.push(light.animate(frames, {
          duration: (0.45 + i * 0.13) * 8 * 1000,
          iterations: Infinity,
          easing: "ease-in-out"
        }));
      }
    }

    this.overlay = overlay;
    document.body.appendChild(overlay);
    Achievements.partyStarted(battleShowing);

    var self = this;
    var started = Audio.playParty(function () { self.finish(); });
    if (!started) {
      /* No audio available, so end the lights on a timer instead of on the track. */
      window.setTimeout(function () { self.finish(); }, 20000);
    }
  },

  /* Ends the party early. The lights still fade rather than snapping off. */
  stop: function () {
    if (!this.running) return;
    Audio.stopParty();
    this.finish();
  },

  finish: function () {
    if (!this.running) return;
    this.running = false;
    var overlay = this.overlay;
    var animations = this.animations;
    this.overlay = null;
    this.animations = [];
    if (!overlay) return;
    overlay.style.opacity = "0";
    window.setTimeout(function () {
      animations.forEach(function (animation) { try { animation.cancel(); } catch (e) {} });
      overlay.remove();
    }, 3000);
  }
};

function toggleParty() {
  Audio.resume();
  if (PartyMode.running) PartyMode.stop();
  else PartyMode.start();
}

/* ─────────────────────────────────────────────────────────────────────────────
 * Main — the code, the function key, and starting up.
 * ───────────────────────────────────────────────────────────────────────────── */

/* Ten keys in a fixed order. Nothing about ordinary play walks into this by accident. */
var PARTY_CODE = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
var partyCodeProgress = 0;

/*
 * A wrong key resets the run, except when that key is itself the start of the code,
 * which lets a fumbled attempt roll straight into the next one.
 */
function trackPartyCode(key) {
  var pressed = key.length === 1 ? key.toLowerCase() : key;
  if (pressed === PARTY_CODE[partyCodeProgress]) {
    partyCodeProgress++;
    if (partyCodeProgress === PARTY_CODE.length) {
      partyCodeProgress = 0;
      toggleParty();
    }
    return;
  }
  partyCodeProgress = pressed === PARTY_CODE[0] ? 1 : 0;
}

document.addEventListener("keydown", function (event) {
  if (event.key === "F11") {
    event.preventDefault();
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) { /* the browser may say no */ }
    return;
  }
  var typing = event.target && (event.target.tagName === "INPUT" || event.target.tagName === "SELECT" || event.target.tagName === "TEXTAREA");
  if (!typing) trackPartyCode(event.key);
  if (currentKeyHandler && !typing) currentKeyHandler(event);
});

/* Browsers will not make a sound until the player has touched the page once. */
["pointerdown", "keydown"].forEach(function (name) {
  document.addEventListener(name, function once() {
    Audio.resume();
    if (Settings.acceptedTermsVersion >= TERMS_VERSION) Audio.playMenuMusic();
    document.removeEventListener(name, once);
  }, { once: true });
});

Settings.load();
Statistics.load();
Achievements.load();
applyTheme();
applyDisplaySettings();

if (Settings.acceptedTermsVersion < TERMS_VERSION) showTerms();
else showMainMenu();
</script>

<style>
/* The status line follows you down a phone screen, where the boards stack. */
@media (max-width: 900px) {
  .battle-top {
    position: sticky;
    /* Sticky offsets are measured from the viewport, which under viewport-fit=cover
       starts behind the notch, so the status line has to clear it itself. */
    top: env(safe-area-inset-top);
    z-index: 20;
    padding: 8px 0 10px !important;
    background: linear-gradient(to bottom, var(--ink-deep) 70%, transparent);
  }
}
</style>
</body>
